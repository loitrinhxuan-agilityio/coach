# Interactive Claude: replies when someone writes "@claude" in a pull request or issue
# comment, or in a reply to an inline review comment.
#
# This is the companion to independent-review.yml, and it is a different mode. The
# reviewer runs in automation mode on every pull request and only reads. This one runs
# in interactive mode and waits to be addressed.
#
# IT CAN WRITE TO THE REPOSITORY. `contents: write` is what lets Claude push a fix to a
# branch when asked, and it is a real escalation over the reviewer, which cannot modify
# code at all. Two things bound it:
#   - GitHub only allows a user with write access to trigger a run, and the action also
#     rejects a bot actor unless it is named in `allowed_bots`. So the reviewer's own
#     claude[bot] comments cannot trigger this workflow, and the two cannot loop.
#   - It must never be asked to merge. docs/agents/team.md reserves merging for the Dev
#     Lead, and workflow.md requires the Owner's approval for every deploy. Nothing here
#     enforces that; it is a rule for whoever writes the comment.
#
# It uses the same CLAUDE_CODE_OAUTH_TOKEN secret as the reviewer, so runs bill to the
# Owner's Claude subscription rather than the API (D-014). If the secret is missing the
# job warns and skips rather than failing.
name: Claude mentions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# One run per thread. A second mention while the first is still working queues behind it
# rather than racing it on the same branch.
concurrency:
  group: claude-mentions-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude (mentioned)
    # Keeps a runner from starting on every comment in the repository. The action checks
    # the trigger phrase itself as well.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Report whether Claude can answer
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set, so the mention was not answered. See .github/workflows/claude-mentions.yml."
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN is present; answering the mention."
          fi

      - uses: actions/checkout@v6
        if: env.CLAUDE_TOKEN != ''
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.CLAUDE_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No `prompt`, which is what selects interactive mode: Claude answers the
          # comment that mentioned it instead of running a fixed instruction.
          claude_args: |
            --model claude-opus-5-5
            --append-system-prompt "This repository is built under the rules in AGENTS.md and docs/agents/. Never push to main and never merge a pull request: docs/agents/team.md reserves merging for the Dev Lead and workflow.md requires the Owner's approval for every deploy. Architecture is decided in docs/adr/ and approved by the Owner before dependent work starts, so propose an ADR rather than assuming one. Design files under docs/design/ailiftcoach/ belong to the Design Agent and never share a pull request with other code. Before relying on a decision in docs/product/decision-log.md, check whether its row is marked amended or superseded and read the amending decision first."
