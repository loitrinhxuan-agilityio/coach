<!-- @dsCard group="Training" height=360 subtitle="Direct work filled by set count, indirect outlined, and a list that carries every value" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@500&display=swap">
<style>
  .wrap { font-family: var(--font-ui, sans-serif); background: var(--surface-page); color: var(--ink); padding: var(--space-4, 16px); }
  .card { background: var(--surface-card); border: 1px solid var(--line); border-radius: var(--radius-lg, 10px); padding: var(--space-5, 24px); }
  h3 { font-size: 19px; line-height: 26px; font-weight: 600; margin: 0 0 2px; }
  .sub { font-size: 12.5px; color: var(--ink-muted); margin-bottom: 16px; }
  .row { display: flex; gap: var(--space-5, 24px); align-items: flex-start; flex-wrap: wrap; }
  .figs { display: flex; gap: var(--space-4, 16px); flex: none; }
  .fig { text-align: center; }
  .fig svg { display: block; width: 104px; height: auto; }
  .fig span { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
  .list { flex: 1; min-width: 190px; max-width: 340px; }
  .m { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .m:last-child { border-bottom: 0; }
  .sw { width: 11px; height: 11px; border-radius: 2px; flex: none; background: var(--series-1); }
  .sw.help { background: transparent; border: 1.5px solid var(--line-strong); }
  .m-n { font-size: 13px; }
  .m-v { margin-left: auto; font-family: var(--font-mono, monospace); font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--ink-muted); }

  .silh { fill: var(--surface-sunken); }
  .d { fill: var(--series-1); }
  .o35 { opacity: .35 } .o55 { opacity: .55 } .o75 { opacity: .75 } .o100 { opacity: 1 }
  .help2 { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
</style>
<div class="wrap">
  <div class="card">
    <h3>Muscles this session</h3>
    <div class="sub">Legs · 4 working sets · filled by set count, outlined where the muscle helped</div>

    <div class="row">
      <div class="figs">
        <div class="fig">
          <svg viewBox="0 0 110 240" role="img" aria-label="Front: quads worked directly for three sets; adductors helped">
            <circle class="silh" cx="55" cy="18" r="11"/>
            <rect class="silh" x="50" y="27" width="10" height="8" rx="3"/>
            <rect class="silh" x="33" y="33" width="44" height="68" rx="9"/>
            <rect class="silh" x="19" y="36" width="12" height="38" rx="6"/>
            <rect class="silh" x="79" y="36" width="12" height="38" rx="6"/>
            <rect class="silh" x="16" y="75" width="11" height="33" rx="5"/>
            <rect class="silh" x="83" y="75" width="11" height="33" rx="5"/>
            <rect class="silh" x="36" y="100" width="38" height="20" rx="7"/>
            <rect class="silh" x="37" y="119" width="16" height="54" rx="7"/>
            <rect class="silh" x="57" y="119" width="16" height="54" rx="7"/>
            <rect class="silh" x="39" y="174" width="13" height="46" rx="6"/>
            <rect class="silh" x="58" y="174" width="13" height="46" rx="6"/>
            <!-- quads: 3 direct sets -->
            <rect class="d o75" x="38" y="122" width="14" height="46" rx="6"/>
            <rect class="d o75" x="58" y="122" width="14" height="46" rx="6"/>
            <!-- adductors: helping -->
            <rect class="help2" x="48" y="124" width="14" height="36" rx="6"/>
          </svg>
          <span>Front</span>
        </div>

        <div class="fig">
          <svg viewBox="0 0 110 240" role="img" aria-label="Back: hamstrings worked directly for one set; glutes and lower back helped">
            <circle class="silh" cx="55" cy="18" r="11"/>
            <rect class="silh" x="50" y="27" width="10" height="8" rx="3"/>
            <rect class="silh" x="33" y="33" width="44" height="68" rx="9"/>
            <rect class="silh" x="19" y="36" width="12" height="38" rx="6"/>
            <rect class="silh" x="79" y="36" width="12" height="38" rx="6"/>
            <rect class="silh" x="16" y="75" width="11" height="33" rx="5"/>
            <rect class="silh" x="83" y="75" width="11" height="33" rx="5"/>
            <rect class="silh" x="36" y="100" width="38" height="20" rx="7"/>
            <rect class="silh" x="37" y="119" width="16" height="54" rx="7"/>
            <rect class="silh" x="57" y="119" width="16" height="54" rx="7"/>
            <rect class="silh" x="39" y="174" width="13" height="46" rx="6"/>
            <rect class="silh" x="58" y="174" width="13" height="46" rx="6"/>
            <!-- lower back: helping -->
            <rect class="help2" x="42" y="76" width="26" height="22" rx="6"/>
            <!-- glutes: helping -->
            <rect class="help2" x="37" y="101" width="36" height="20" rx="7"/>
            <!-- hamstrings: 1 direct set -->
            <rect class="d o35" x="38" y="122" width="14" height="46" rx="6"/>
            <rect class="d o35" x="58" y="122" width="14" height="46" rx="6"/>
          </svg>
          <span>Back</span>
        </div>
      </div>

      <div class="list">
        <div class="m"><i class="sw o75"></i><span class="m-n">Quads</span><span class="m-v">3 sets</span></div>
        <div class="m"><i class="sw o35"></i><span class="m-n">Hamstrings</span><span class="m-v">1 set</span></div>
        <div class="m"><i class="sw help"></i><span class="m-n">Glutes</span><span class="m-v">4 helping</span></div>
        <div class="m"><i class="sw help"></i><span class="m-n">Lower back</span><span class="m-v">4 helping</span></div>
        <div class="m"><i class="sw help"></i><span class="m-n">Adductor magnus</span><span class="m-v">3 helping</span></div>
      </div>
    </div>
  </div>
</div>
