<!-- @dsCard group="Data display" height=330 subtitle="Set, Today, Last time, e1RM — with the rule that sets next time" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@500&display=swap">
<style>
  .wrap {
    font-family: var(--font-ui, sans-serif);
    background: var(--surface-page);
    color: var(--ink);
    padding: var(--space-4, 16px);
  }
  .card {
    background: var(--surface-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg, 10px);
    overflow: hidden;
  }
  .head {
    display: flex;
    align-items: baseline;
    gap: var(--space-3, 12px);
    padding: var(--space-4, 16px) var(--space-5, 24px);
    flex-wrap: wrap;
  }
  .name { font-size: 19px; line-height: 26px; font-weight: 600; }
  .muscles { font-size: 12.5px; color: var(--ink-muted); min-width: 0; }
  .link { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 11px;
    line-height: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    text-align: left;
    padding: var(--space-2, 8px) var(--space-5, 24px);
    background: var(--surface-sunken);
    border-bottom: 1px solid var(--line-strong);
    white-space: nowrap;
  }
  td {
    font-family: var(--font-mono, monospace);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 500;
    padding: var(--space-3, 12px) var(--space-5, 24px);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .c-set { color: var(--ink-muted); font-size: 12.5px; width: 1%; }
  .c-today { color: var(--ink); }
  .c-last { color: var(--ink-muted); }
  .c-e1rm { color: var(--ink-muted); text-align: right; }
  th.c-e1rm { text-align: right; }
  .best {
    font-family: var(--font-ui, sans-serif);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--state-ok);
    background: var(--state-ok-soft);
    border-radius: var(--radius-sm, 3px);
    padding: 2px 6px;
    margin-left: var(--space-2, 8px);
  }
  .foot {
    padding: var(--space-3, 12px) var(--space-5, 24px) var(--space-4, 16px);
    font-size: 14px;
    line-height: 21px;
    color: var(--ink-muted);
  }
  .foot b { color: var(--ink); font-weight: 600; }
</style>
<div class="wrap">
  <div class="card">
    <div class="head">
      <span class="name">Back Squat</span>
      <span class="muscles">quads · glutes · adductor magnus · lower back</span>
      <a class="link" href="#progress">Progress ›</a>
    </div>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th class="c-set">Set</th>
            <th>Today</th>
            <th>Last time</th>
            <th class="c-e1rm">e1RM</th>
          </tr>
        </thead>
        <tbody>
          <tr><td class="c-set">1</td><td class="c-today">100 × 5</td><td class="c-last">97.5 × 5</td><td class="c-e1rm">117</td></tr>
          <tr><td class="c-set">2</td><td class="c-today">100 × 5</td><td class="c-last">97.5 × 5</td><td class="c-e1rm">117</td></tr>
          <tr><td class="c-set">3</td><td class="c-today">100 × 5<span class="best">Best set</span></td><td class="c-last">97.5 × 4</td><td class="c-e1rm">117</td></tr>
        </tbody>
      </table>
    </div>
    <div class="foot"><b>Three sessions at the same weight.</b> Next time: 102.5&nbsp;kg, 5 on every set.</div>
  </div>
</div>
