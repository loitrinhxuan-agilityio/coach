<!-- @dsCard group="Training" height=210 subtitle="Bar loading in real IWF plate colours, per side, each plate labelled" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@500&display=swap">
<style>
  .wrap {
    font-family: var(--font-ui, sans-serif);
    background: var(--surface-page);
    color: var(--ink);
    padding: var(--space-4, 16px);
  }
  .card {
    background: var(--surface-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg, 10px);
    padding: var(--space-4, 16px);
    display: flex;
    flex-direction: column;
    gap: var(--space-3, 12px);
  }
  .top { display: flex; align-items: baseline; gap: var(--space-2, 8px); flex-wrap: wrap; }
  .target {
    font-family: var(--font-mono, monospace);
    font-variant-numeric: tabular-nums;
    font-size: 23px;
    line-height: 28px;
    font-weight: 500;
  }
  .per {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .strip { display: flex; align-items: center; gap: 3px; padding: var(--space-2, 8px) 0; }
  .bar { height: 6px; width: 34px; background: var(--line-strong); border-radius: 2px; flex: none; }
  .collar { height: 26px; width: 7px; background: var(--plate-5); border: 1px solid var(--line-strong); border-radius: 2px; flex: none; }
  .plate {
    width: 20px;
    border-radius: 2px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 3px;
    font-family: var(--font-mono, monospace);
    font-size: 10px;
    font-weight: 500;
    color: #ffffff;
    flex: none;
  }
  .p25 { background: var(--plate-25); height: 84px; }
  .p20 { background: var(--plate-20); height: 76px; }
  .p15 { background: var(--plate-15); height: 68px; color: #1b1405; }
  .p10 { background: var(--plate-10); height: 58px; }
  .p5  { background: var(--plate-5); height: 46px; color: #11181d; border: 1px solid var(--line-strong); }
  .note { font-size: 12.5px; line-height: 18px; color: var(--ink-muted); }
</style>
<div class="wrap">
  <div class="card">
    <div class="top">
      <span class="target">102.5 kg</span>
      <span class="per">per side</span>
    </div>
    <div class="strip">
      <span class="bar"></span>
      <span class="plate p25">25</span>
      <span class="plate p15">15</span>
      <span class="plate p5">1.25</span>
      <span class="collar"></span>
    </div>
    <div class="note">20&nbsp;kg bar · 41.25&nbsp;kg a side · Iron Works has 1.25&nbsp;kg fractionals.</div>
  </div>
</div>
