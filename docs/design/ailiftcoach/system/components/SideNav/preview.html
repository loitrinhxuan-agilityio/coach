<!-- @dsCard group="Navigation" height=470 subtitle="Six destinations, Settings apart, and agent status pinned to the foot" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@500&display=swap">
<style>
  .wrap {
    font-family: var(--font-ui, sans-serif);
    background: var(--surface-page);
    color: var(--ink);
    padding: var(--space-4, 16px);
  }
  .nav {
    width: 240px;
    background: var(--surface-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg, 10px);
    padding: var(--space-4, 16px);
    display: flex;
    flex-direction: column;
    gap: var(--space-2, 8px);
    min-height: 420px;
  }
  .mark {
    font-size: 16px;
    line-height: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: var(--space-2, 8px) var(--space-2, 8px) var(--space-3, 12px);
  }
  .mark span { color: var(--ink-muted); font-weight: 500; }
  .row {
    display: flex;
    align-items: center;
    gap: var(--space-3, 12px);
    padding: var(--space-2, 8px) var(--space-2, 8px);
    border-radius: var(--radius-md, 6px);
    font-size: 14px;
    color: var(--ink-muted);
    text-decoration: none;
    min-height: 36px;
  }
  .row:hover { background: var(--surface-sunken); color: var(--ink); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .row svg { width: 18px; height: 18px; flex: none; }
  .rule { height: 1px; background: var(--line); margin: var(--space-2, 8px) 0; }
  .spacer { flex: 1 1 auto; min-height: var(--space-4, 16px); }
  .agent {
    border: 1px solid var(--line);
    border-radius: var(--radius-md, 6px);
    padding: var(--space-3, 12px);
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-decoration: none;
  }
  .agent:hover { background: var(--surface-sunken); }
  .agent-top { display: flex; align-items: center; gap: var(--space-2, 8px); font-size: 13px; font-weight: 600; color: var(--ink); }
  .dot { width: 7px; height: 7px; border-radius: var(--radius-round, 999px); background: var(--state-ok); flex: none; }
  .agent-sub { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
</style>
<div class="wrap">
  <nav class="nav" aria-label="Main">
    <div class="mark">AI Lift <span>Coach</span></div>

    <a class="row" aria-current="page" href="#today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      Today
    </a>
    <a class="row" href="#training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10"/></svg>
      Training
    </a>
    <a class="row" href="#progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-5 3 3 7-8"/><path d="M15 8h5v5"/></svg>
      Progress
    </a>
    <a class="row" href="#body">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2.2"/><path d="M12 8v7M8 10h8M9.5 20l2.5-5 2.5 5"/></svg>
      Body
    </a>
    <a class="row" href="#food">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v8M7 12v8M5 4v4a2 2 0 0 0 4 0V4"/><path d="M16 4c-1.5 2-1.5 6 0 8v8"/></svg>
      Food
    </a>
    <a class="row" href="#goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.2"/></svg>
      Goals
    </a>

    <div class="rule"></div>

    <a class="row" href="#settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4L5.6 5.6"/></svg>
      Settings
    </a>

    <div class="spacer"></div>

    <a class="agent" href="#settings-agents">
      <span class="agent-top"><i class="dot"></i>Claude · Connected</span>
      <span class="agent-sub">Last wrote 16:07 · 4 sets today</span>
    </a>
  </nav>
</div>
