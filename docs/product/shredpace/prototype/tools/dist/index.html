<title>Shredpace Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a quiet instrument panel wrapped around a loud product. The chrome is
   graphite and recedes; the only ember in it marks what is currently on.       */
:root{
  --ink:#09090a;        /* stage, behind the board            */
  --chrome:#0d0d0f;     /* the panel itself                   */
  --raise:#17171b;      /* controls, cards in the chrome      */
  --line:#26262b;
  --fg:#e9e9ec;
  --muted:#8a8a93;
  --ember:#ff5b1f;      /* Shredpace's own accent, Ember dark */
  --on:#0e0e10;
  --good:#8bd17c;
  --warn:#f6c445;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --display:'Archivo','Inter',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--sans);margin:0;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:30;background:var(--chrome)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}

/* ---- chrome -------------------------------------------------------------- */
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--chrome);
  border-bottom:1px solid var(--line)}
.chrome .wrap{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding-block:11px}
.mark{font-family:var(--display);font-style:italic;font-stretch:78%;font-weight:800;
  text-transform:uppercase;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.mark i{color:var(--ember);font-style:inherit}
.mark span{font-family:var(--sans);font-style:normal;font-stretch:normal;font-weight:600;
  font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin-left:9px;vertical-align:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:5px 11px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);
  white-space:nowrap;transition:background .12s,color .12s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--on)}
.seg.live button[aria-pressed="true"]{background:var(--ember);color:var(--on)}
.seg .lbl{padding:5px 9px 5px 11px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:600;align-self:center;cursor:default}
.open{display:inline-flex;align-items:center;gap:7px;background:var(--raise);border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:11.5px;font-weight:600}
.open:hover{border-color:var(--muted)}
.open b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}

/* readout strip */
.readout{border-bottom:1px solid var(--line);background:var(--ink)}
.readout .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding-block:8px;
  font-family:var(--mono);font-size:11.5px;min-width:0}
.readout .r{color:var(--ember)}
.readout .arrow{color:var(--muted)}
.readout .b{color:var(--fg)}
.readout .meta{color:var(--muted);margin-left:auto;display:flex;gap:14px;flex-wrap:wrap}
.readout .note{color:var(--warn)}

/* ---- stage --------------------------------------------------------------- */
.stage{padding-block:26px 56px}
.stage .wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fit{position:relative;overflow:hidden;background:#0e0e10;border:1px solid var(--line);max-width:100%}
.fit.desk{border-radius:10px}
.fit.phone{border-radius:34px;padding:0;box-shadow:0 30px 70px -30px #000}
.bd{position:absolute;top:0;left:0;transform-origin:top left}
.fit.phone .bd{border-radius:33px;overflow:hidden}
.cap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--muted);text-align:center}
.cap b{color:var(--fg);font-weight:600}
.cap .z{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---- screen directory ---------------------------------------------------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,5,6,.82);display:grid;
  grid-template-rows:auto 1fr;overflow:hidden}
.sheet[hidden]{display:none!important}
.sheet .top{background:var(--chrome);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px)}
.sheet .top .wrap{display:flex;gap:14px;align-items:center;padding-block:13px}
.sheet h2{font-family:var(--display);font-style:italic;font-stretch:80%;font-weight:800;
  text-transform:uppercase;font-size:17px;margin:0}
.sheet .count{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.sheet .body{overflow-y:auto;background:var(--ink);padding-block:18px 60px}
.grp{margin-bottom:22px}
.grp h3{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 9px;font-weight:600}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:7px}
.row{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:var(--raise);
  border:1px solid var(--line);border-radius:11px;padding:10px 13px;min-width:0}
.row:hover{border-color:var(--muted)}
.row[aria-current="true"]{border-color:var(--ember)}
.row .rt{font-family:var(--mono);font-size:11.5px;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.row .bn{font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.row .tag{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:999px;white-space:nowrap}
.tag.pro{background:rgba(255,91,31,.15);color:#ff8a4c}
.tag.lock{background:rgba(246,196,69,.14);color:var(--warn)}
.tag.pub{background:rgba(139,209,124,.13);color:var(--good)}
.close{margin-left:auto;background:var(--raise);border:1px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:11.5px;font-weight:600}

.note-bar{background:rgba(246,196,69,.09);border-bottom:1px solid var(--line)}
.note-bar .wrap{padding-block:7px;font-size:11.5px;color:var(--warn)}
.note-bar[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

003cp style=\"margin-top: 4px\">quads, glutes\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"lbl\">Also works\u003c/p>\u003cp style=\"margin-top: 4px\">adductor magnus, adductors, lower back\u003c/p>\u003c/div>\n          \u003cdiv>\u003cp class=\"lbl\">Rep range\u003c/p>\u003cp style=\"margin-top: 4px\">5\u20138 \u003cspan class=\"mut\">\u00b7 your setting\u003c/span>\u003c/p>\u003c/div>\u003cdiv>\u003cp class=\"lbl\">Increment\u003c/p>\u003cp style=\"margin-top: 4px\">2.5 kg\u003c/p>\u003c/div>\n        \u003c/div>\n        \u003cdiv style=\"border-top: 1px solid #ececea; padding-top: 12px\">\u003cp class=\"lbl\">Loaded as \u003cspan style=\"text-transform: none; letter-spacing: 0; font-weight: 400\">sets the label and the maths\u003c/span>\u003c/p>\u003cp style=\"font-size: 12.5px; margin-top: 6px\">Barbell: log the total, the bar included.\u003c/p>\u003cspan class=\"seg\" style=\"margin-top: 8px\">\u003cbutton type=\"button\" class=\"on\">Bar\u003c/button>\u003c/span>\u003cp class=\"mut\" style=\"font-size: 11.5px; margin-top: 8px; line-height: 1.5\">Not counted: the total is the plates. Records here compare only with this lift. A Smith machine starts here; a trap bar or an EZ bar takes its own weight.\u003c/p>\u003c/div>\n        \u003cdiv style=\"border-top: 1px solid #ececea; padding-top: 12px\">\u003cp class=\"lbl\">Your progress\u003c/p>\u003cp class=\"mut\" style=\"font-size: 12px; margin-top: 4px\">estimated 1RM \u00b7 1 session\u003c/p>\u003cp style=\"font-size: 26px; font-weight: 600; margin-top: 4px\">117 \u003cspan style=\"font-size: 14px; font-weight: 500\">kg\u003c/span>\u003c/p>\u003c/div>\n        \u003cdiv style=\"border-top: 1px solid #ececea; padding-top: 12px\">\u003cp class=\"lbl\">Notes from your trainer\u003c/p>\u003cp class=\"mut\" style=\"font-size: 12.5px; margin-top: 4px\">No notes yet. Ask your agent to add some.\u003c/p>\u003c/div>\n        \u003cdiv class=\"say\">\u003cspan>\u201cChange how Back Squat is loaded\u201d\u003c/span>\u003cbutton type=\"button\">Copy\u003c/button>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\u003cp style=\"margin: auto 0 0; font-size: 11.5px; color: #67676b; line-height: 1.55; max-width: 96ch\">Redrawn from the live dashboard on 18 Nov 2026 (Studio, light). Layout, labels and copy were observed; the body figure is a placeholder for the real anatomical illustration, tile tints are approximate, and the figures are sample data.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"FoodDesktop":{"title":"Food","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside style=\"flex: 0 0 218px; min-width: 0; border-right: 1px solid #ececea; padding: 24px 14px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; background: #f7f7f5\">\n    \u003cspan style=\"font-size: 17px; font-weight: 700; padding: 0 10px; letter-spacing: -.02em\">Shredpace\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#today\">Today\u003c/a>\u003ca href=\"#sessions\">Training\u003c/a>\u003ca class=\"on\" href=\"#food\">Food\u003c/a>\u003ca href=\"#body\">Body\u003c/a>\u003ca href=\"#goals\">Goals\u003c/a>\u003c/nav>\n    \u003cdiv>\u003cp class=\"lbl\" style=\"padding: 0 10px; margin-bottom: 6px\">Tools\u003c/p>\u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#connect\">Ask Claude\u003c/a>\u003ca href=\"#connect\">Your agents\u003c/a>\u003ca href=\"#coach\">Coach\u003c/a>\u003ca href=\"#account\">Settings\u003c/a>\u003c/nav>\u003c/div>\n    \u003ca href=\"#connect\" class=\"panel\" style=\"margin-top: auto; padding: 12px 14px; text-decoration: none; display: block\">\u003cstrong style=\"font-size: 12px; color: #141416; display: block\">Claude is connected\u003c/strong>\u003cspan style=\"font-size: 11.5px; color: #67676b; line-height: 1.5\">Last heard 18:02 \u00b7 logs every set you send\u003c/span>\u003c/a>\n  \u003c/aside>\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 18px 34px 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box\">\n\u003cdiv style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\u003cdiv>\u003cp class=\"mut\" style=\"font-size: 12.5px\">Wed 18 Nov \u00b7 training day\u003c/p>\u003cdiv style=\"display: flex; gap: 12px; align-items: center; margin-top: 4px; flex-wrap: wrap\">\u003ch1 style=\"font-size: 30px\">Food today\u003c/h1>\u003cspan class=\"chip\">Lose fat and build muscle\u003c/span>\u003c/div>\u003c/div>\u003cdiv style=\"display: flex; gap: 12px; align-items: center; min-height: 44px\">\u003cspan style=\"font-size: 11.5px; color: #67676b\">Wed, Nov 18, 2026\u003c/span>\u003cspan class=\"av\">S\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n      \u003cdiv style=\"flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n        \u003cdiv style=\"padding: 20px; border-radius: 14px; background: #f7e8de; border: 1px solid #ecd7c7; display: flex; flex-wrap: wrap; gap: 22px; align-items: center\">\n          \u003csvg width=\"120\" height=\"120\" viewBox=\"0 0 120 120\" role=\"img\" aria-label=\"1,950 kcal left\">\u003ccircle cx=\"60\" cy=\"60\" r=\"48\" fill=\"none\" stroke=\"#f1d9c8\" stroke-width=\"9\"/>\u003ccircle cx=\"60\" cy=\"60\" r=\"48\" fill=\"none\" stroke=\"#c2410c\" stroke-width=\"9\" stroke-linecap=\"round\" stroke-dasharray=\"75 301\" transform=\"rotate(-90 60 60)\"/>\u003ctext x=\"60\" y=\"58\" text-anchor=\"middle\" font-family=\"Inter, sans-serif\" font-size=\"24\" font-weight=\"600\" fill=\"#141416\">1,950\u003c/text>\u003ctext x=\"60\" y=\"76\" text-anchor=\"middle\" font-family=\"Inter, sans-serif\" font-size=\"11\" fill=\"#67676b\">kcal left\u003c/text>\u003c/svg>\n          \u003cdiv style=\"flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\u003cdiv>\u003cp class=\"lbl\">Today against your targets\u003c/p>\u003cp style=\"font-size: 16px; font-weight: 600; margin-top: 4px\">650 of 2,600 kcal \u003cspan class=\"mut\" style=\"font-weight: 400; font-size: 13px\">and 165 g protein\u003c/span>\u003c/p>\u003c/div>\n            \u003cdiv>\u003cdiv style=\"display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px\">\u003cspan>Protein\u003c/span>\u003cspan class=\"mut\" style=\"font-variant-numeric: tabular-nums\">35 g / 165 g\u003c/span>\u003c/div>\u003cdiv style=\"height: 6px; border-radius: 999px; background: #f1d9c8\">\u003cdiv style=\"width: 21%; height: 6px; border-radius: 999px; background: #c2410c\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv>\u003cdiv style=\"display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px\">\u003cspan>Carbs\u003c/span>\u003cspan class=\"mut\" style=\"font-variant-numeric: tabular-nums\">80 g / 340 g\u003c/span>\u003c/div>\u003cdiv style=\"height: 6px; border-radius: 999px; background: #f1d9c8\">\u003cdiv style=\"width: 24%; height: 6px; border-radius: 999px; background: #c2410c\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv>\u003cdiv style=\"display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px\">\u003cspan>Fat\u003c/span>\u003cspan class=\"mut\" style=\"font-variant-numeric: tabular-nums\">21 g / 65 g\u003c/span>\u003c/div>\u003cdiv style=\"height: 6px; border-radius: 999px; background: #f1d9c8\">\u003cdiv style=\"width: 32%; height: 6px; border-radius: 999px; background: #c2410c\">\u003c/div>\u003c/div>\u003c/div>\n            \u003cp style=\"font-size: 11.5px; color: #67676b; line-height: 1.5\">Training day: about 150 kcal over your daily average, as carbs for today\u2019s session. Workout burn is never added back.\u003c/p>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"panel\" style=\"padding: 16px 20px\">\u003cp class=\"lbl\">Meals \u003cspan style=\"text-transform: none; letter-spacing: 0; font-weight: 400\">tap one to see it\u003c/span>\u003c/p>\n          \u003ctable style=\"margin-top: 6px\">\u003cthead>\u003ctr>\u003cth>Time\u003c/th>\u003cth>Meal\u003c/th>\u003cth>kcal\u003c/th>\u003cth>Protein\u003c/th>\u003cth>Carbs\u003c/th>\u003cth>Fat\u003c/th>\u003cth>Source\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>17:42\u003c/td>\u003ctd>\u003cstrong>Chicken rice bowl\u003c/strong>\u003c/td>\u003ctd>650\u003c/td>\u003ctd>35 g\u003c/td>\u003ctd>80 g\u003c/td>\u003ctd>21 g\u003c/td>\u003ctd class=\"mut\">you said\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n        \u003cdiv class=\"panel\" style=\"padding: 16px 20px\">\u003cp class=\"lbl\">Last 14 days\u003c/p>\u003cp style=\"font-size: 13px; margin-top: 8px\">\u003cstrong>Average 650 kcal \u00b7 35 g protein\u003c/strong>\u003c/p>\n          \u003cdiv style=\"display: flex; gap: 6px; align-items: flex-end; height: 56px; margin-top: 10px; border-bottom: 1px dashed #c9c9c4\">\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"flex: 1\">\u003c/span>\u003cspan style=\"width: 12px; height: 24px; border-radius: 4px 4px 0 0; background: #e6a97c\">\u003c/span>\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex: 1 1 250px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n        \u003cdiv class=\"panel\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 8px\">\u003cp class=\"lbl\">Your usuals\u003c/p>\u003cdiv class=\"say\">\u003cspan>\u201cLog my usual chicken rice bowl\u201d\u003c/span>\u003cbutton type=\"button\">Copy\u003c/button>\u003c/div>\u003c/div>\n        \u003cdiv class=\"panel\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 8px\">\u003cp class=\"lbl\">Tell Claude\u003c/p>\u003cdiv class=\"say\">\u003cspan>\u201cAsk me what I ate\u201d\u003c/span>\u003cbutton type=\"button\">Copy\u003c/button>\u003c/div>\u003cp class=\"mut\" style=\"font-size: 12px\">Or send Claude a photo of your plate.\u003c/p>\u003c/div>\n        \u003cdiv class=\"panel\" style=\"padding: 16px\">\u003cp class=\"lbl\">Bodyweight\u003c/p>\u003cp style=\"font-size: 28px; font-weight: 600; margin-top: 6px\">82.3 \u003cspan class=\"mut\" style=\"font-size: 14px; font-weight: 500\">kg\u003c/span>\u003c/p>\u003cp class=\"mut\" style=\"font-size: 12px\">7-day average 82.3\u003c/p>\u003c/div>\n        \u003cdiv class=\"panel\" style=\"padding: 16px\">\u003cp class=\"lbl\">From your coach\u003c/p>\u003cp style=\"font-size: 12.5px; margin-top: 8px; line-height: 1.55\">Weigh in a few mornings a week: after two weeks I can tell whether your targets fit.\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\u003cp style=\"margin: auto 0 0; font-size: 11.5px; color: #67676b; line-height: 1.55; max-width: 96ch\">Redrawn from the live dashboard on 18 Nov 2026 after the account held real data (Studio, light). Labels, copy, structure and order were observed. The body figure is a placeholder for the real illustration, tile tints are approximate, and figures and times are sample data.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"FreeCoachLocked":{"title":"Coach, locked","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside class=\"sb\">\n    \u003cspan class=\"hd\" style=\"font-size: 19px; padding: 0 8px\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\n      \u003ca href=\"#today\">Today\u003c/a>\n      \u003ca href=\"#sessions\">Sessions\u003c/a>\n      \u003ca href=\"#progress\">Progress\u003c/a>\n      \u003ca href=\"#plan\">Your plan\u003c/a>\n      \u003ca class=\"on\" href=\"#coach\">Coach \u003cspan style=\"font-size: 10px; color: #a1a1aa\">\u00b7 locked\u003c/span>\u003c/a>\n      \u003ca href=\"#goals\">Goals\u003c/a>\n      \u003ca href=\"#account\">Settings\u003c/a>\n    \u003c/nav>\n    \u003cspan style=\"margin-top: auto; font-size: 10.5px; color: #a1a1aa; padding: 0 8px\">Free plan \u00b7 one agent key\u003c/span>\n  \u003c/aside>\n\n  \u003cmain class=\"mn\">\n    \u003cdiv>\n      \u003ch1 class=\"hd\" style=\"font-size: 34px\">Coach\u003c/h1>\n      \u003cp style=\"margin: 7px 0 0; font-size: 13px; color: #a1a1aa\">From your coach, locked\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 30px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; border-color: #ff5b1f\">\n      \u003cdiv style=\"flex: 999 1 340px; min-width: 0\">\n        \u003cspan class=\"tag\" style=\"background: rgba(255,91,31,.14); color: #ff8a4c\">Pro\u003c/span>\n        \u003ch2 class=\"hd\" style=\"font-size: 27px; margin: 13px 0 11px\">After a week, your coach starts noticing things\u003c/h2>\n        \u003cp style=\"margin: 0 0 18px; font-size: 13.5px; color: #a1a1aa; line-height: 1.6\">Stalls, push\u2013pull imbalance and training load, checked every morning. Accept a step-back and your plan changes with it.\u003c/p>\n        \u003cul style=\"margin: 0 0 20px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d4d4d8\">\n          \u003cli>\u003cspan style=\"color: #8bd17c\">\u2713\u003c/span> Spots a lift that has stopped moving, and plans the step-back\u003c/li>\n          \u003cli>\u003cspan style=\"color: #8bd17c\">\u2713\u003c/span> Writes your week from what you actually did\u003c/li>\n          \u003cli>\u003cspan style=\"color: #8bd17c\">\u2713\u003c/span> Your whole history, compared for life\u003c/li>\n          \u003cli>\u003cspan style=\"color: #8bd17c\">\u2713\u003c/span> Programs, adaptive food targets, several agent keys\u003c/li>\n        \u003c/ul>\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 11px; align-items: center\">\n          \u003ca href=\"#go-pro\" style=\"display: inline-grid; place-items: center; height: 46px; padding: 0 24px; border-radius: 999px; background: #ff5b1f; color: #0e0e10; font-weight: 700; font-size: 14px; text-decoration: none\">Turn on Pro \u2014 free for now\u003c/a>\n          \u003cspan style=\"font-size: 12px; color: #a1a1aa\">Free during early access\u003c/span>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv style=\"flex: 1 1 280px; min-width: 0\" aria-hidden=\"true\">\n        \u003cdiv class=\"blur\" style=\"display: flex; flex-direction: column; gap: 11px\">\n          \u003cdiv style=\"background: #131316; border: 1px solid #2e2e33; border-radius: 14px; padding: 15px\">\n            \u003cp class=\"lbl\" style=\"color: #f6c445\">Stall\u003c/p>\n            \u003cp style=\"margin: 7px 0 0; font-size: 13px; font-weight: 600\">Bench Press hasn\u2019t moved in 3 weeks\u003c/p>\n            \u003cp style=\"margin: 6px 0 0; font-size: 11.5px; color: #a1a1aa\">A week about 20% lighter, then back at 82.5 for 5.\u003c/p>\n          \u003c/div>\n          \u003cdiv style=\"background: #131316; border: 1px solid #2e2e33; border-radius: 14px; padding: 15px\">\n            \u003cp class=\"lbl\" style=\"color: #f6c445\">Balance\u003c/p>\n            \u003cp style=\"margin: 7px 0 0; font-size: 13px; font-weight: 600\">You press about twice as much as you pull\u003c/p>\n          \u003c/div>\n          \u003cdiv style=\"background: #131316; border: 1px solid #2e2e33; border-radius: 14px; padding: 15px\">\n            \u003cp class=\"lbl\" style=\"color: #8bd17c\">Load\u003c/p>\n            \u003cp styl x; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; background: #f7f7f5\">\n    \u003cspan style=\"font-size: 17px; font-weight: 700; padding: 0 10px; letter-spacing: -.02em\">Shredpace\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#today\">Today\u003c/a>\u003ca href=\"#sessions\">Training\u003c/a>\u003ca href=\"#food\">Food\u003c/a>\u003ca href=\"#body\">Body\u003c/a>\u003ca href=\"#goals\">Goals\u003c/a>\u003c/nav>\n    \u003cdiv>\u003cp class=\"lbl\" style=\"padding: 0 10px; margin-bottom: 6px\">Tools\u003c/p>\u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#connect\">Ask Claude\u003c/a>\u003ca href=\"#connect\">Your agents\u003c/a>\u003ca href=\"#coach\">Coach\u003c/a>\u003ca class=\"on\" href=\"#account\">Settings\u003c/a>\u003c/nav>\u003c/div>\n    \u003ca href=\"#connect\" class=\"panel\" style=\"margin-top: auto; padding: 12px 14px; text-decoration: none; display: block\">\u003cstrong style=\"font-size: 12px; color: #141416; display: block\">Claude is connected\u003c/strong>\u003cspan style=\"font-size: 11.5px; color: #67676b; line-height: 1.5\">Last heard 18:02 \u00b7 logs every set you send\u003c/span>\u003c/a>\n  \u003c/aside>\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 18px 34px 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box\">\n\u003cdiv style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\u003cdiv>\u003ca href=\"#account\" style=\"font-size: 13px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center\">\u2039 Settings\u003c/a>\u003ch1 style=\"font-size: 30px; margin-top: 2px\">Your gym\u003c/h1>\u003cp class=\"mut\" style=\"font-size: 13px; margin-top: 6px\">What your gym has, so every target is a weight you can pick up.\u003c/p>\u003c/div>\u003cdiv style=\"display: flex; gap: 12px; align-items: center; min-height: 44px\">\u003cspan style=\"font-size: 11.5px; color: #67676b\">Wed, Nov 18, 2026\u003c/span>\u003cspan class=\"av\">S\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv class=\"panel\" style=\"padding: 6px 20px\">\u003cp class=\"lbl\" style=\"padding-top: 14px\">Free weights\u003c/p>\u003cdiv class=\"row\">\u003cspan>Bar\u003csmall>Barbell sets read as totals\u003c/small>\u003c/span>\u003cspan style=\"display: flex; gap: 10px; align-items: center\">\u003cspan class=\"chip\">Agent\u003c/span>\u003cspan class=\"ch\">20 kg\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"row\">\u003cspan>Plates\u003csmall>in pairs\u003c/small>\u003c/span>\u003cspan style=\"display: flex; gap: 10px; align-items: center\">\u003cspan class=\"chip\">Agent\u003c/span>\u003cspan class=\"ch\">25, 20, 15, 10, 5, 2.5, 1.25 kg, the usual\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"row\">\u003cspan>Dumbbells\u003csmall>per hand\u003c/small>\u003c/span>\u003cspan style=\"display: flex; gap: 10px; align-items: center\">\u003cspan class=\"chip\">Agent\u003c/span>\u003cspan class=\"ch\">2.5 to 30 kg in 2.5s\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"row\">\u003cspan>Kettlebells\u003csmall>\u003c/small>\u003c/span>\u003cspan style=\"display: flex; gap: 10px; align-items: center\">\u003cspan class=\"chip\">Agent\u003c/span>\u003cspan class=\"ch\">Not set\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"row\">\u003cspan>Machines\u003csmall>\u003c/small>\u003c/span>\u003cspan style=\"display: flex; gap: 10px; align-items: center\">\u003cspan class=\"chip\">Agent\u003c/span>\u003cspan class=\"ch\">None yet\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n    \u003cp class=\"mut\" style=\"font-size: 12.5px; line-height: 1.55\">Until your agent knows, kettlebells and machines round to 2.5 kg steps.\u003c/p>\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\u003cp class=\"lbl\">To change one, tell Claude\u003c/p>\u003cdiv class=\"say\">\u003cspan>\u201cSet my dumbbells\u201d\u003c/span>\u003cbutton type=\"button\">Copy\u003c/button>\u003c/div>\u003cdiv class=\"say\">\u003cspan>\u201cSet a machine\u2019s weights\u201d\u003c/span>\u003cbutton type=\"button\">Copy\u003c/button>\u003c/div>\u003c/div>\n\u003cp style=\"margin: auto 0 0; font-size: 11.5px; color: #67676b; line-height: 1.55; max-width: 96ch\">Redrawn from the live dashboard on 18 Nov 2026 after the account held real data (Studio, light). Labels, copy, structure and order were observed. The body figure is a placeholder for the real illustration, tile tints are approximate, and figures and times are sample data.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"Legal":{"title":"Privacy and terms","w":1280,"h":900,"html":"\u003cdiv style=\"min-height: 900px; box-sizing: border-box; padding: 0 0 44px\">\n  \u003cheader style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 22px 48px; border-bottom: 1px solid #2e2e33\">\n    \u003ca href=\"#landing\" class=\"hd\" style=\"font-size: 19px; text-decoration: none; color: #f4f4f5\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/a>\n    \u003cdiv class=\"seg\" role=\"group\" aria-label=\"Document\">\n      \u003cbutton type=\"button\" class=\"on\">Privacy\u003c/button>\n      \u003cbutton type=\"button\">Terms\u003c/button>\n      \u003cbutton type=\"button\">Credits\u003c/button>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 44px; padding: 34px 48px 0\">\n    \u003cnav class=\"toc\" style=\"flex: 0 0 220px; min-width: 0\">\n      \u003cp class=\"lbl\" style=\"margin-bottom: 9px\">On this page\u003c/p>\n      \u003ca data-scroll=\"who\">Who\u2019s responsible\u003c/a>\n      \u003ca data-scroll=\"stored\">What\u2019s stored\u003c/a>\n      \u003ca data-scroll=\"google\">Signing in with Google\u003c/a>\n      \u003ca data-scroll=\"health\">Health details and your consent\u003c/a>\n      \u003ca data-scroll=\"why\">Why we may use it\u003c/a>\n      \u003ca data-scroll=\"agents\">Your agents\u003c/a>\n      \u003ca data-scroll=\"dont\">What we don\u2019t do\u003c/a>\n      \u003ca data-scroll=\"export\">Export or delete\u003c/a>\n      \u003ca data-scroll=\"rights\">Your rights\u003c/a>\n    \u003c/nav>\n\n    \u003carticle style=\"flex: 999 1 460px; min-width: 0; max-width: 68ch\">\n      \u003ch1 class=\"hd\" style=\"font-size: 34px\">Privacy\u003c/h1>\n      \u003cp style=\"color: #a1a1aa; font-size: 12.5px; margin-top: 8px\">Updated 24 October 2026 \u00b7 \u003ca href=\"#contact\">Make a privacy request \u203a\u003c/a>\u003c/p>\n\n      \u003ch2 id=\"who\">Who\u2019s responsible\u003c/h2>\n      \u003cp>Shredpace is operated by a named company, which decides how your data is used: the controller, under the GDPR. Write to the privacy mailbox, or use the contact form.\u003c/p>\n\n      \u003ch2 id=\"stored\">What\u2019s stored\u003c/h2>\n      \u003cp>Only what the app needs to keep your training log: your email address, kept by Amazon Web Services to sign you in; your workouts, settings, plans, programs and goals, stored in the EU (Ireland); what you write in workout notes, as you wrote it; and your height, year of birth and body type if you give them.\u003c/p>\n      \u003cp>If you agree: body readings, meals, check-ins, your health-check answers, injuries and limitations, time away when ill or injured, dietary needs, the numbers you track, aches and pains, and what you tell your agent about a session. Photos and screenshots are never stored.\u003c/p>\n      \u003cp>API keys are stored hashed: the key is shown to you once, and only its name, its first 8 characters and when it last called are kept. Error logs are kept for one month. Contact messages are kept until a year after they are resolved. Billing records are kept for 6 years, because tax law requires it.\u003c/p>\n\n      \u003ch2 id=\"google\">Signing in with Google\u003c/h2>\n      \u003cp>If you choose Continue with Google, Google gives Shredpace your name, your email address and your Google account ID, and nothing else. They are used only to create your account and sign you in, and are never sold, shared or used for advertising. Delete your account to remove them, or revoke access at your Google account\u2019s permissions page.\u003c/p>\n\n      \u003ch2 id=\"health\">Health details and your consent\u003c/h2>\n      \u003cp>Body readings, meals, check-ins, injuries and the rest of the list above are health details: special category data under the GDPR. They are kept only with your explicit consent, given once, on the dashboard or at the link your agent sends you.\u003c/p>\n      \u003cp>Turn it off in Settings \u203a Privacy and they are deleted at once, including the copies in the activity log. A record of each time you agreed or turned it off is kept as proof, with the words you saw, for as long as the account exists and 3 years after. When the words change, you are asked again: until you answer, your health details are paused, and after 30 days they are deleted.\u003c/p>\n\n      \u003ch2 id=\"why\">Why we may use it\u003c/h2>\n      \u003cp>To run the service you signed up for (a contract); health details only with your explicit consent; messages and error logs to answer you and keep the service secure (a legitimate interest); and billing records because the law requires them.\u003c/p>\n\n      \u003ch2 id=\"agents\">Your agents\u003c/h2>\n      \u003cp>Your agents read and write your log through the API keys you create. A key can log and read workouts. It can\u2019t manage keys or your account, and it can\u2019t agree to keep health details for you. Revoke a key in Settings and it stops working at once.\u003c/p>\n\n      \u003ch2 id=\"dont\">What we don\u2019t do\u003c/h2>\n      \u003cp>Your data is never sold or shared. Amazon Web Services processes it for us in the EU (Ireland), only on our instructions. There are no analytics, trackers or ads: the pages load only the app\u2019s own scripts and fonts.\u003c/p>\n\n      \u003ch2 id=\"export\">Export or delete\u003c/h2>\n      \u003cp>Export from Settings (JSON; CSV comes with Pro). Delete your account in Settings \u203a Account and everything in it goes at once. A paid plan is cancelled with no refund; only the consent record (3 years) and billing records (6 years) stay.\u003c/p>\n\n      \u003ch2 id=\"rights\">Your rights\u003c/h2>\n      \u003cp>You can ask for a copy of your data, a correction, deletion, or to restrict or object to how it is used. We answer within one month. You can take your data with you, withdraw consent at any time, and complain to a data protection authority.\u003c/p>\n    \u003c/article>\n  \u003c/div>\n\u003c/div>"},"Main":{"title":"Landing","w":1280,"h":1700,"html":"\u003cdiv style=\"width: 100%; max-width: 1280px; margin: 0 auto; box-sizing: border-box; padding: 0 0 72px\">\n\n  \u003cheader style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 22px 48px; border-bottom: 1px solid #2e2e33\">\n    \u003cspan class=\"hd\" style=\"font-size: 21px\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/span>\n    \u003cnav style=\"display: flex; flex-wrap: wrap; gap: 26px; font-size: 14px\">\n      \u003ca data-scroll=\"how\" style=\"color: #a1a1aa; text-decoration: none\">How it works\u003c/a>\n      \u003ca data-scroll=\"pricing\" style=\"color: #a1a1aa; text-decoration: none\">Pricing\u003c/a>\n      \u003ca href=\"https://shredpace.com/docs\" style=\"color: #a1a1aa; text-decoration: none\">API docs\u003c/a>\n      \u003ca href=\"#signin\" style=\"color: #f4f4f5; text-decoration: none; font-weight: 600\">Sign in\u003c/a>\n    \u003c/nav>\n  \u003c/header>\n\n  \u003csection style=\"display: flex; flex-wrap: wrap; gap: 48px; padding: 56px 48px 0\">\n    \u003cdiv style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n      \u003cp class=\"eyebrow\">Works with Claude, ChatGPT and Grok\u003c/p>\n      \u003ch1 class=\"hd\" style=\"font-size: 60px; text-wrap: balance\">Your AI is now\u003cbr>your trainer\u003c/h1>\n      \u003cp style=\"margin: 0; font-size: 17px; line-height: 1.55; color: #d4d4d8; max-width: 52ch\">Tell Claude, ChatGPT or any agent what you did. It logs it, coaches you, and this is what you see.\u003c/p>\n      \u003cp style=\"margin: 0; font-size: 14px; color: #a1a1aa; max-width: 52ch\">For anyone training 2\u20136 times a week, new or experienced, who already talks to an AI.\u003c/p>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px\">\n        \u003ca class=\"cta\" href=\"#signin\">Create a free account\u003c/a>\n        \u003ca class=\"ghost\" data-scroll=\"how\">See how it works\u003c/a>\n      \u003c/div>\n      \u003cul style=\"margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; color: #a1a1aa\">\n        \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Built on progressive overload, effort (RPE) and planned deloads\u003c/li>\n        \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Your data is yours: export any time, delete in one tap\u003c/li>\n        \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Coaching, not medical advice: injuries and conditions go to a professional\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n\n    \u003cdiv style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n      \u003cdiv class=\"card\" style=\"padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n        \u003cdiv style=\"align-self: flex-end; max-width: 80%; background: #ff5b1f; color: #0e0e10; padding: 10px 14px; border-radius: 18px 18px 4px 18px; font-size: 14px; font-weight: 600\">Squat 100 kg for 5, 5, 5\u003c/div>\n        \u003cdiv style=\"align-self: flex-start; max-width: 88%; background: #131316; border: 1px solid #2e2e33; padding: 10px 14px; border-radius: 18px 18px 18px 4px; font-size: 14px; line-height: 1.5; color: #d4d4d8\">Logged. That\u2019s 2.5 kg up on last Thursday, same reps.\u003cbr>\u003cspan style=\"color: #f4f4f5; font-weight: 600\">Next set: 100 \u00d7 5. Rest about 3 minutes.\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 18px\">\n        \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px\">\n          \u003cspan style=\"font-size: 12px; color: #a1a1aa\">\u003cspan style=\"color: #ff5b1f\">\u25cf\u003c/span> Live \u00b7 Legs \u00b7 24 min\u003c/span>\n          \u003cspan style=\"font-size: 11px; color: #8bd17c; font-weight: 600\">Ahead of last time\u003c/span>\n        \u003c/div>\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Exercise\u003c/th>\u003cth style=\"text-align: right\">Today\u003c/th>\u003cth style=\"text-align: right\">Last time\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>Squat\u003c/td>\u003ctd style=\"text-align: right; font-weight: 600\">100 \u00d7 5 \u00d73\u003c/td>\u003ctd style=\"text-align: right; color: #a1a1aa\">97.5 \u00d7 5 \u00d73\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Romanian deadlift\u003c/td>\u003ctd style=\"text-align: right; font-weight: 600\">80 \u00d7 8\u003c/td>\u003ctd style=\"text-align: right; color: #a1a1aa\">80 \u00d7 8\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd style=\"color: #a1a1aa\">Leg press\u003c/td>\u003ctd style=\"text-align: right; color: #a1a1aa\">next\u003c/td>\u003ctd style=\"text-align: right; color: #a1a1aa\">160 \u00d7 10\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection style=\"padding: 44px 48px 0\">\n    \u003cp class=\"eyebrow\" style=\"margin-bottom: 14px\">Works with\u003c/p>\n    \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600\">Claude\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600\">ChatGPT\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600\">Grok\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px; color: #a1a1aa\">Your own bot\u003c/span>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"how\" style=\"padding: 52px 48px 0\">\n    \u003ch2 class=\"hd\" style=\"font-size: 30px; margin-bottom: 24px\">Connect once. Then just talk.\u003c/h2>\n    \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px\">\n      \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 9px\">\n        \u003cspan class=\"hd\" style=\"font-size: 26px; color: #ff5b1f\">1\u003c/span>\n        \u003cstrong style=\"font-size: 15px\">Create an account\u003c/strong>\n        \u003cp style=\"margin: 0; font-size: 13.5px; color: #a1a1aa; line-height: 1.5\">Email or Google. It takes a minute.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 9px\">\n        \u003cspan class=\"hd\" style=\"font-size: 26px; color: #ff5b1f\">2\u003c/span>\n        \u003cstrong style=\"font-size: 15px\">Connect your agent\u003c/strong>\n        \u003cp style=\"margin: 0; font-size: 13.5px; color: #a1a1aa; line-height: 1.5\">A connector in Claude, Grok or ChatGPT (one click in Claude and Grok), or a key for anything else.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 9px\">\n        \u003cspan class=\"hd\" style=\"font-size: 26px; color: #ff5b1f\">3\u003c/span>\n        \u003cstrong style=\"font-size: 15px\">Train and talk\u003c/strong>\n        \u003cp style=\"margin: 0; font-size: 13.5px; color: #a1a1aa; line-height: 1.5\">Between sets or after. It logs, coaches, and the dashboard keeps score.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection style=\"padding: 52px 48px 0\">\n    \u003cp class=\"eyebrow\" style=\"margin-bottom: 14px\">Not just the gym\u003c/p>\n    \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px\">\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px\">Lifts\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px\">Runs\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px\">Rides\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px\">Swims\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px\">Hikes\u003c/span>\n      \u003cspan class=\"card\" style=\"padding: 9px 16px; border-radius: 999px; font-size: 13px\">Mobility\u003c/span>\n    \u003c/div>\n    \u003ch2 class=\"hd\" style=\"font-size: 30px; margin-bottom: 20px\">What your trainer does\u003c/h2>\n    \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px\">\n      \u003cdiv class=\"card\" style=\"padding: 20px\">\u003cstrong style=\"font-size: 14.5px\">Picks your next weight\u003c/strong>\u003cp style=\"margin: 8px 0 0; font-size: 13px; color: #a1a1aa; line-height: 1.5\">From your history and your rep range, with the reason.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 20px\">\u003cstrong style=\"font-size: 14.5px\">Remembers every session\u003c/strong>\u003cp style=\"margin: 8px 0 0; font-size: 13px; color: #a1a1aa; line-height: 1.5\">Your agent reads what you did last time before it answers.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 20px\">\u003cstrong style=\"font-size: 14.5px\">Shows what you trained\u003c/strong>\u003cp style=\"margin: 8px 0 0; font-size: 13px; color: #a1a1aa; line-height: 1.5\">A body map of the muscles you worked, by session, week or longer.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 20px\">\u003cstrong style=\"font-size: 14.5px\">Food that follows your goal\u003c/strong>\u003cp style=\"margin: 8px 0 0; font-size: 13px; color: #a1a1aa; line-height: 1.5\">Calories first when you cut, protein first when you build.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 20px\">\u003cstrong style=\"font-size: 14.5px\">Coaches like a trainer\u003c/strong>\u003cp style=\"margin: 8px 0 0; font-size: 13px; color: #a1a1aa; line-height: 1.5\">Spots stalls, plans step-backs and writes your week.\u003c/p>\u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 20px\">\u003cstrong style=\"font-size: 14.5px\">Your data stays yours\u003c/strong>\u003cp style=\"margin: 8px 0 0; font-size: 13px; color: #a1a1aa; line-height: 1.5\">Nothing is deleted if you change plans. Keys are hashed and revocable.\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection style=\"padding: 52px 48px 0\">\n    \u003cdiv class=\"card\" style=\"padding: 28px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center\">\n      \u003cdiv style=\"flex: 999 1 340px; min-width: 0\">\n        \u003cp class=\"eyebrow\" style=\"margin-bottom: 10px\">Building your own bot?\u003c/p>\n        \u003ch2 class=\"hd\" style=\"font-size: 26px; margin-bottom: 10px\">One key, one link, the whole API\u003c/h2>\n        \u003cp style=\"margin: 0 0 16px; font-size: 13.5px; color: #a1a1aa; line-height: 1.55\">Everything the dashboard does, your agent can do. MCP for Claude, OpenAPI for ChatGPT, plain HTTP for the rest.\u003c/p>\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px\">\n          \u003cspan style=\"padding: 6px 12px; border: 1px solid #2e2e33; border-radius: 999px; color: #a1a1aa\">MCP\u003c/span>\n          \u003cspan style=\"padding: 6px 12px; border: 1px solid #2e2e33; border-radius: 999px; color: #a1a1aa\">openapi.json\u003c/span>\n          \u003cspan style=\"padding: 6px 12px; border: 1px solid #2e2e33; border-radius: 999px; color: #a1a1aa\">llms.txt (for agents)\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex: 1 1 300px; min-width: 0; background: #0e0e10; border: 1px solid #2e2e33; border-radius: 14px; padding: 16px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; color: #d4d4d8; overflow-x: auto\">curl https://shredpace.com/api/today \\\u003cbr>&nbsp;&nbsp;-H \"X-Api-Key: gtk_\u2026\"\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"pricing\" style=\"padding: 52px 48px 0\">\n    \u003cp class=\"eyebrow\" style=\"margin-bottom: 10px\">Pricing \u00b7 Early access\u003c/p>\n    \u003ch2 class=\"hd\" style=\"font-size: 30px; margin-bottom: 10px\">Pro is free while we\u2019re in early access\u003c/h2>\n    \u003cp style=\"margin: 0 0 22px; font-size: 14px; color: #a1a1aa; max-width: 62ch; line-height: 1.55\">Sign up now and everything is on: your whole history, several agents, the coach. Tell us what works. When pricing is ready, you\u2019ll know at least 14 days ahead.\u003c/p>\n    \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px\">\n      \u003cdiv class=\"card\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n        \u003cdiv>\u003cstrong class=\"hd\" style=\"font-size: 22px\">Free\u003c/strong> \u003cspan style=\"font-size: 22px; color: #a1a1aa\">$0\u003c/span>\u003c/div>\n        \u003cul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d4d4d8\">\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Unlimited logging, every activity\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Today, live comparisons and session summaries\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Food, body readings and goals\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Charts for the last 90 days; older data kept\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> One agent key\u003c/li>\n        \u003c/ul>\n        \u003ca class=\"ghost\" href=\"#signin\" style=\"align-self: flex-start; margin-top: auto\">Create a free account\u003c/a>\n      \u003c/div>\n      \u003cdiv class=\"card\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 14px; border-color: #ff5b1f\">\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline\">\n          \u003cstrong class=\"hd\" style=\"font-size: 22px\">Pro\u003c/strong>\n          \u003cspan style=\"font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #0e0e10; background: #ff5b1f; padding: 4px 9px; border-radius: 999px; font-weight: 700\">Free for now\u003c/span>\n        \u003c/div>\n        \u003cp style=\"margin: -4px 0 0; font-size: 12px; color: #a1a1aa\">During early access \u00b7 price at launch\u003c/p>\n        \u003cul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #d4d4d8\">\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Everything in Free\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Your whole history, compared for life\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Coach: stalls, step-backs and the week\u2019s plan\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Programs, and food targets that adapt\u003c/li>\n          \u003cli>\u003cspan class=\"tick\">\u2713\u003c/span> Several agent keys; CSV and JSON export\u003c/li>\n        \u003c/ul>\n        \u003ca class=\"cta\" href=\"#signin\" style=\"align-self: flex-start; margin-top: auto\">Create a free account\u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cfooter style=\"margin: 56px 48px 0; padding-top: 22px; border-top: 1px solid #2e2e33; display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; font-size: 12.5px; color: #a1a1aa\">\n    \u003cspan>\u00a9 2026 Shredpace\u003c/span>\n    \u003cnav style=\"display: flex; flex-wrap: wrap; gap: 18px\">\n      \u003ca data-scroll=\"how\" style=\"color: #a1a1aa; text-decoration: none\">How it works\u003c/a>\n      \u003ca data-scroll=\"pricing\" style=\"color: #a1a1aa; text-decoration: none\">Pricing\u003c/a>\n      \u003ca href=\"#privacy\" style=\"color: #a1a1aa; text-decoration: none\">Privacy\u003c/a>\n      \u003ca href=\"#privacy\" style=\"color: #a1a1aa; text-decoration: none\">Terms\u003c/a>\n      \u003ca href=\"#contact\" style=\"color: #a1a1aa; text-decoration: none\">Contact\u003c/a>\n    \u003c/nav>\n  \u003c/footer>\n\n\u003c/div>"},"MealExtras":{"title":"Your usuals","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside style=\"flex: 0 0 218px; min-width: 0; border-right: 1px solid #ececea; padding: 24px 14px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; background: #f7f7f5\">\n    \u003cspan style=\"font-size: 17px; font-weight: 700; padding: 0 10px; letter-spacing: -.02em\">Shredpace\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#today\">Today\u003c/a>\u003ca href=\"#sessions\">Training\u003c/a>\u003ca class=\"on\" href=\"#food\">Food\u003c/a>\u003ca href=\"#body\">Body\u003c/a>\u003ca href=\"#goals\">Goals\u003c/a>\u003c/nav>\n    \u003cdiv>\u003cp class=\"lbl\" style=\"padding: 0 10px; margin-bottom: 6px\">Tools\u003c/p>\u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#connect\">Ask Claude\u003c/a>\u003ca href=\"#connect\">Your agents\u003c/a>\u003ca href=\"#coach\">Coach\u003c/a>\u003ca href=\"#account\">Settings\u003c/a>\u003c/nav>\u003c/div>\n    \u003ca href=\"#connect\" class=\"panel\" style=\"margin-top: auto; padding: 12px 14px; text-decoration: none; display: block\">\u003cstrong style=\"font-size: 12px; color: #141416; display: block\">Claude is connected\u003c/strong>\u003cspan style=\"font-size: 11.5px; color: #67676b; line-height: 1.5\">Last heard 18:02 \u00b7 logs every set you send\u003c/span>\u003c/a>\n  \u003c/aside>\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 18px 34px 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box\">\n\u003cdiv style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\u003cdiv>\u003ca href=\"#food\" style=\"font-size: 13px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center\">\u2039 Food\u003c/a>\u003ch1 style=\"font-size: 30px; margin-top: 2px\">Your usuals\u003c/h1>\u003c/div>\u003cdiv style=\"display: flex; gap: 12px; align-items: center; min-height: 44px\">\u003cspan style=\"font-size: 11.5px; color: #67676b\">Wed, Nov 18, 2026\u003c/span>\u003cspan class=\"av\">S\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"panel\" style=\"padding: 4px 20px; max-width: 680px\">\u003ca class=\"row\" href=\"#food-usuals\">\u003cstrong>Chicken rice bowl\u003c/strong>\u003cspan class=\"ch\">650 kcal \u203a\u003c/span>\u003c/a>\u003c/div>\n\u003cp style=\"margin: auto 0 0; font-size: 11.5px; color: #67676b; line-height: 1.55; max-width: 96ch\">Redrawn from the live dashboard on 18 Nov 2026 after the account held real data (Studio, light). Labels, copy, structure and order were observed. The body figure is a placeholder for the real illustration, tile tints are approximate, and figures and times are sample data.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"MissedDays":{"title":"Today: missed day, time away, easing back","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside style=\"flex: 0 0 232px; min-width: 0; border-right: 1px solid #2e2e33; padding: 22px 16px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box\">\n    \u003cspan class=\"hd\" style=\"font-size: 19px; padding: 0 8px\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\n      \u003ca class=\"on\" href=\"#today\">Today\u003c/a>\n      \u003ca href=\"#sessions\">Sessions\u003c/a>\n      \u003ca href=\"#progress\">Progress\u003c/a>\n      \u003ca href=\"#exercises\">Exercises\u003c/a>\n      \u003ca href=\"#plan\">Your plan\u003c/a>\n      \u003ca href=\"#coach\">Coach\u003c/a>\n      \u003ca href=\"#food\">Food\u003c/a>\n      \u003ca href=\"#body\">Body\u003c/a>\n      \u003ca href=\"#goals\">Goals\u003c/a>\n      \u003ca href=\"#activity\">What changed\u003c/a>\n      \u003ca href=\"#account\">Settings\u003c/a>\n    \u003c/nav>\n  \u003c/aside>\n\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box\">\n    \u003cdiv>\n      \u003ch1 class=\"hd\" style=\"font-size: 34px\">Today\u003c/h1>\n      \u003cp style=\"margin: 6px 0 0; font-size: 13px; color: #a1a1aa\">Three states of the same card. Only one shows at a time: time away first, then coming back, then a missed day.\u003c/p>\n    \u003c/div>\n\n    \u003c!-- 1. A missed day -->\n    \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-wrap: wrap; gap: 22px\">\n      \u003cdiv style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n        \u003cdiv style=\"display: flex; gap: 12px; align-items: center\">\n          \u003cspan class=\"ic\" style=\"background: rgba(246,196,69,.14); color: #f6c445\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M20 12a8 8 0 1 1-2.6-5.9\"/>\u003cpath d=\"M20 4v5h-5\"/>\u003c/svg>\u003c/span>\n          \u003cp class=\"lbl\">A planned day went by\u003c/p>\n        \u003c/div>\n        \u003ch2 class=\"hd\" style=\"font-size: 23px; margin-top: 4px\">You had Legs planned yesterday and didn\u2019t train\u003c/h2>\n        \u003cp style=\"margin: 0; font-size: 13px; color: #a1a1aa; line-height: 1.55\">Move the week back a day, or keep today\u2019s session and fit Legs in later. One tap either way, and one undo puts it back.\u003c/p>\n        \u003cp style=\"margin: 6px 0 0; font-size: 12px; color: #8bd17c; line-height: 1.5\">You said your legs are still sore, so keeping Push today gives them time.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"flex: 0 1 46%; min-width: 260px; display: flex; flex-direction: column; gap: 10px\">\n        \u003cbutton type=\"button\" class=\"ask\">\u003cstrong>Legs today, move the week\u003c/strong>\u003cspan>Moved: Legs today, Push Saturday.\u003c/span>\u003c/button>\n        \u003cbutton type=\"button\" class=\"ask primary\">\u003cstrong>Keep Push today\u003c/strong>\u003cspan>Legs goes into Saturday\u2019s rest day.\u003c/span>\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 2. Time away -->\n    \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-wrap: wrap; gap: 22px; align-items: center\">\n      \u003cdiv style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n        \u003cdiv style=\"display: flex; gap: 12px; align-items: center\">\n          \u003cspan class=\"ic\" style=\"background: rgba(139,209,124,.14); color: #8bd17c\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4\"/>\u003c/svg>\u003c/span>\n          \u003cp class=\"lbl\">Time away\u003c/p>\n        \u003c/div>\n        \u003ch2 class=\"hd\" style=\"font-size: 23px; margin-top: 4px\">Away until Sat 14 Nov\u003c/h2>\n        \u003cp style=\"margin: 0; font-size: 13px; color: #a1a1aa; line-height: 1.55\">These days don\u2019t count against your plan or your streak.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"flex: 0 1 46%; min-width: 260px\">\n        \u003cbutton type=\"button\" class=\"ask\">\u003cstrong>I\u2019m back early\u003c/strong>\u003cspan>Ends the time away today.\u003c/span>\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 3. Easing back in -->\n    \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-wrap: wrap; gap: 22px; align-items: center\">\n      \u003cdiv style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n        \u003cdiv style=\"display: flex; gap: 12px; align-items: center\">\n          \u003cspan class=\"ic\" style=\"background: rgba(255,91,31,.14); color: #ff8a4c\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M7 17L17 7\"/>\u003cpath d=\"M9 7h8v8\"/>\u003c/svg>\u003c/span>\n          \u003cp class=\"lbl\">First session back\u003c/p>\n        \u003c/div>\n        \u003ch2 class=\"hd\" style=\"font-size: 23px; margin-top: 4px\">An easy effort today\u003c/h2>\n        \u003cp style=\"margin: 0; font-size: 13px; color: #a1a1aa; line-height: 1.55\">Kept around 7 today. Lifts only: a run or a swim isn\u2019t eased.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"flex: 0 1 46%; min-width: 260px; font-size: 12px; color: #a1a1aa; line-height: 1.55\">\n        \u003ca href=\"#state-comeback\" style=\"color: #ff8a4c; text-decoration: none\">Same weights, or ease in? \u203a\u003c/a>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cp style=\"margin: 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.55\">Reconstructed from the publisher\u2019s agent guide and changelog (23\u201326 Oct). The board name MissedDays appears in the shipped code; this layout is ours.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"NavigationMore":{"title":"The avatar menu on a phone","w":390,"h":844,"html":"\u003cdiv style=\"position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; background: #0e0e10\">\n\n  \u003c!-- Today, dimmed behind the sheet. The avatar keeps a ring while its menu is open. -->\n  \u003cdiv style=\"position: absolute; top: 0; left: 0; right: 0; padding: 18px; opacity: .55; pointer-events: none\" aria-hidden=\"true\">\n    \u003cdiv style=\"display: flex; justify-content: space-between; align-items: flex-start\">\n      \u003cdiv>\n        \u003cp style=\"margin: 0; font-size: 15px; color: #a1a1aa\">Hello,\u003c/p>\n        \u003ch1 class=\"hd\" style=\"font-size: 30px; margin-top: 2px\">Sam.\u003c/h1>\n        \u003cp style=\"margin: 6px 0 0; font-size: 12px; color: #a1a1aa\">Here\u2019s your training today.\u003c/p>\n      \u003c/div>\n      \u003cspan style=\"width: 32px; height: 32px; border-radius: 999px; background: #18181b; border: 1px solid #2e2e33; display: grid; place-items: center; font-weight: 700; font-size: 11px; box-shadow: 0 0 0 2px #0e0e10, 0 0 0 4px #ff5b1f\">S\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"sheet\" role=\"dialog\" aria-label=\"Account menu\">\n    \u003cd "button\" class=\"btn\">\u2039 Previous\u003c/button>\u003cbutton type=\"button\" class=\"btn\">Next \u203a\u003c/button>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 20px\">\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px\">\n        \u003cdiv class=\"day done\">\u003cstrong style=\"font-size: 11.5px; color: #8bd17c\">Mon 10\u003c/strong>\u003cspan style=\"font-size: 12.5px; font-weight: 600\">Legs\u003c/span>\u003cspan class=\"note\">Done \u00b7 61 min \u00b7 15 sets\u003c/span>\u003c/div>\n        \u003cdiv class=\"day off\">\u003cstrong style=\"font-size: 11.5px; color: #a1a1aa\">Tue 11\u003c/strong>\u003cspan style=\"font-size: 12px; color: #a1a1aa\">Rest\u003c/span>\u003cspan class=\"note\">Hiked 11.4 km anyway\u003c/span>\u003c/div>\n        \u003cdiv class=\"day done\">\u003cstrong style=\"font-size: 11.5px; color: #8bd17c\">Wed 12\u003c/strong>\u003cspan style=\"font-size: 12.5px; font-weight: 600\">Push\u003c/span>\u003cspan class=\"note\">Done \u00b7 56 min \u00b7 16 sets\u003c/span>\u003c/div>\n        \u003cdiv class=\"day\">\u003cstrong style=\"font-size: 11.5px; color: #a1a1aa\">Thu 13\u003c/strong>\u003cspan style=\"font-size: 12.5px; font-weight: 600; color: #a1a1aa\">Easy run\u003c/span>\u003cspan class=\"note\" style=\"color: #f6c445\">Missed \u00b7 plan shifted\u003c/span>\u003c/div>\n        \u003cdiv class=\"day done\">\u003cstrong style=\"font-size: 11.5px; color: #8bd17c\">Fri 14\u003c/strong>\u003cspan style=\"font-size: 12.5px; font-weight: 600\">Easy run\u003c/span>\u003cspan class=\"note\">Done \u00b7 8.2 km \u00b7 42 min\u003c/span>\u003c/div>\n        \u003cdiv class=\"day off\">\u003cstrong style=\"font-size: 11.5px; color: #a1a1aa\">Sat 15\u003c/strong>\u003cspan style=\"font-size: 12px; color: #a1a1aa\">Rest\u003c/span>\u003c/div>\n        \u003cdiv class=\"day done\">\u003cstrong style=\"font-size: 11.5px; color: #8bd17c\">Sun 16\u003c/strong>\u003cspan style=\"font-size: 12.5px; font-weight: 600\">Push\u003c/span>\u003cspan class=\"note\">Done \u00b7 58 min \u00b7 2 records\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 22px; margin-top: 17px; font-size: 12.5px\">\n        \u003cspan style=\"color: #a1a1aa\">Planned \u003cstrong style=\"color: #f4f4f5\">5\u003c/strong>\u003c/span>\n        \u003cspan style=\"color: #a1a1aa\">Done as planned \u003cstrong style=\"color: #8bd17c\">4\u003c/strong>\u003c/span>\n        \u003cspan style=\"color: #a1a1aa\">Missed \u003cstrong style=\"color: #f6c445\">1\u003c/strong>\u003c/span>\n        \u003cspan style=\"color: #a1a1aa\">Volume \u003cstrong style=\"color: #f4f4f5\">17,660 kg\u003c/strong>\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n      \u003cdiv class=\"card\" style=\"flex: 999 1 400px; min-width: 0; padding: 20px\">\n        \u003cp class=\"lbl\" style=\"margin-bottom: 4px\">Notes for every agent\u003c/p>\n        \u003cdiv class=\"n\">\u003cspan class=\"k\" style=\"background: rgba(255,138,76,.16); color: #ff8a4c\">Rule\u003c/span>\u003cspan style=\"font-size: 12.5px; color: #d4d4d8; line-height: 1.55\">Don\u2019t schedule legs the day before a long hike.\u003c/span>\u003c/div>\n        \u003cdiv class=\"n\">\u003cspan class=\"k\" style=\"background: rgba(255,138,76,.16); color: #ff8a4c\">Rule\u003c/span>\u003cspan style=\"font-size: 12.5px; color: #d4d4d8; line-height: 1.55\">Ask before changing my weekly target. Don\u2019t just move it.\u003c/span>\u003c/div>\n        \u003cdiv class=\"n\">\u003cspan class=\"k\" style=\"background: rgba(143,164,255,.16); color: #8fa4ff\">Preference\u003c/span>\u003cspan style=\"font-size: 12.5px; color: #d4d4d8; line-height: 1.55\">Keep the reply to one line mid-session. Tables at home only.\u003c/span>\u003c/div>\n        \u003cdiv class=\"n\">\u003cspan class=\"k\" style=\"background: rgba(143,164,255,.16); color: #8fa4ff\">Preference\u003c/span>\u003cspan style=\"font-size: 12.5px; color: #d4d4d8; line-height: 1.55\">No shellfish. Whey is fine.\u003c/span>\u003c/div>\n        \u003cp style=\"margin: 13px 0 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.55\">Standing rules and preferences live where every agent reads them, not just the one you told.\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"card\" style=\"flex: 1 1 260px; min-width: 0; padding: 20px\">\n        \u003cp class=\"lbl\" style=\"margin-bottom: 11px\">The week in your words\u003c/p>\n        \u003cp style=\"margin: 0 0 14px; font-size: 12.5px; color: #d4d4d8; line-height: 1.6; font-style: italic\">\u201cTravel week. Skipped Thursday, got it back on Friday. Bench finally felt easy.\u201d\u003c/p>\n        \u003cp class=\"lbl\" style=\"margin-bottom: 9px\">Consent\u003c/p>\n        \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.6\">Check-ins are on, so sleep, soreness and energy are kept against each day. Turn them off and this column empties from then on.\u003c/p>\n      \u003c/div>\n    \u003c/div>\n  \u003c/main>\n\u003c/div>"},"NutritionSettings":{"title":"Food targets","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside style=\"flex: 0 0 218px; min-width: 0; border-right: 1px solid #ececea; padding: 24px 14px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; background: #f7f7f5\">\n    \u003cspan style=\"font-size: 17px; font-weight: 700; padding: 0 10px; letter-spacing: -.02em\">Shredpace\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#today\">Today\u003c/a>\u003ca href=\"#sessions\">Training\u003c/a>\u003ca class=\"on\" href=\"#food\">Food\u003c/a>\u003ca href=\"#body\">Body\u003c/a>\u003ca href=\"#goals\">Goals\u003c/a>\u003c/nav>\n    \u003cdiv>\u003cp class=\"lbl\" style=\"padding: 0 10px; margin-bottom: 6px\">Tools\u003c/p>\u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#connect\">Ask Claude\u003c/a>\u003ca href=\"#connect\">Your agents\u003c/a>\u003ca href=\"#coach\">Coach\u003c/a>\u003ca href=\"#account\">Settings\u003c/a>\u003c/nav>\u003c/div>\n    \u003ca href=\"#connect\" class=\"panel\" style=\"margin-top: auto; padding: 12px 14px; text-decoration: none; display: block\">\u003cstrong style=\"font-size: 12px; color: #141416; display: block\">Claude is connected\u003c/strong>\u003cspan style=\"font-size: 11.5px; color: #67676b; line-height: 1.5\">Last heard 18:02 \u00b7 logs every set you send\u003c/span>\u003c/a>\n  \u003c/aside>\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 18px 34px 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box\">\n\u003cdiv style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\u003cdiv>\u003ca href=\"#food\" style=\"font-size: 13px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center\">\u2039 Food\u003c/a>\u003ch1 style=\"font-size: 30px; margin-top: 2px\">Food targets\u003c/h1>\u003c/div>\u003cdiv style=\"display: flex; gap: 12px; align-items: center; min-height: 44px\">\u003cspan style=\"font-size: 11.5px; color: #67676b\">Wed, Nov 18, 2026\u003c/span>\u003cspan class=\"av\">S\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv class=\"panel\" style=\"padding: 20px; max-width: 700px\">\u003cp class=\"lbl\">Focus\u003c/p>\u003ch2 style=\"font-size: 20px; margin-top: 8px\">Lose fat, build muscle\u003c/h2>\u003c/div>\n    \u003cdiv class=\"panel\" style=\"padding: 6px 20px; max-width: 700px\">\u003cdiv class=\"row\">\u003cspan>Calories\u003csmall>about 10% under maintenance, a day on average: training days about 150 more, rest days about 150 less\u003c/small>\u003c/span>\u003cstrong style=\"font-size: 18px; font-variant-numeric: tabular-nums\">
