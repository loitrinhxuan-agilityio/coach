22px; margin-top: 6px\">84 cm\u003c/p>\u003cp style=\"margin: 3px 0 0; font-size: 10.5px; color: #a1a1aa\">Tape\u003c/p>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px\">\n      \u003cp class=\"lbl\" style=\"margin-bottom: 6px\">Recent readings\u003c/p>\n      \u003cdiv class=\"r\">\u003cspan>81.4 kg \u00b7 20.6% fat\u003cbr>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">Today 07:02 \u00b7 Withings scale\u003c/span>\u003c/span>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">scale\u003c/span>\u003c/div>\n      \u003cdiv class=\"r\">\u003cspan>Full scan\u003cbr>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">Sun \u00b7 read from a screenshot\u003c/span>\u003c/span>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">scan\u003c/span>\u003c/div>\n      \u003cdiv class=\"r\">\u003cspan>81.9 kg\u003cbr>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">Fri 06:58 \u00b7 Withings scale\u003c/span>\u003c/span>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">scale\u003c/span>\u003c/div>\n      \u003cdiv class=\"r\" style=\"border: 0\">\u003cspan>Waist 84 cm, chest 104 cm\u003cbr>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">10 Nov \u00b7 tape\u003c/span>\u003c/span>\u003cspan style=\"font-size: 11px; color: #a1a1aa\">tape\u003c/span>\u003c/div>\n      \u003cp style=\"margin: 11px 0 0; font-size: 11px; color: #a1a1aa\">A trend needs 3 readings.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cnav class=\"tabs\">\n    \u003ca href=\"#today\">\u003cspan class=\"dot\">\u003c/span>Today\u003c/a>\n    \u003ca href=\"#sessions\">\u003cspan class=\"dot\">\u003c/span>Training\u003c/a>\n    \u003ca href=\"#food\">\u003cspan class=\"dot\">\u003c/span>Food\u003c/a>\n    \u003ca class=\"on\" href=\"#body\">\u003cspan class=\"dot\">\u003c/span>Body\u003c/a>\n    \u003ca href=\"#goals\">\u003cspan class=\"dot\">\u003c/span>Goals\u003c/a>\n  \u003c/nav>\n\u003c/div>"},"PhoneConsentPage":{"title":"Consent on a phone","w":390,"h":844,"html":"\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cheader style=\"padding: 16px 18px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2e2e33\">\n    \u003cspan class=\"hd\" style=\"font-size: 18px\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/span>\n    \u003cspan style=\"font-size: 11px; color: #a1a1aa\">Step 2 of 2\u003c/span>\n  \u003c/header>\n\n  \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 15px\">\n    \u003cdiv>\n      \u003cp class=\"lbl\">A consent question\u003c/p>\n      \u003ch1 class=\"hd\" style=\"font-size: 30px; margin-top: 10px; text-wrap: balance\">What may we keep about your body?\u003c/h1>\n      \u003cp style=\"margin: 12px 0 0; font-size: 12.5px; color: #a1a1aa; line-height: 1.6\">Each is health data, and each is separate. Turn one off and nothing about it is kept from then on. Workouts, plans and other goals stay either way.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 2px 16px\">\n      \u003cdiv class=\"row\">\n        \u003cspan style=\"flex: 1; min-width: 0\">\u003cstrong style=\"font-size: 13px\">Body readings\u003c/strong>\u003cp style=\"margin: 5px 0 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.5\">Weigh-ins, scans, tape. Needed for the bodyweight trend.\u003c/p>\u003c/span>\n        \u003cbutton type=\"button\" class=\"sw\" style=\"background: #8bd17c\" aria-label=\"Body readings on\" aria-pressed=\"true\">\u003cspan style=\"right: 3px\">\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cspan style=\"flex: 1; min-width: 0\">\u003cstrong style=\"font-size: 13px\">Food\u003c/strong>\u003cp style=\"margin: 5px 0 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.5\">Meals and the targets from your focus.\u003c/p>\u003c/span>\n        \u003cbutton type=\"button\" class=\"sw\" style=\"background: #8bd17c\" aria-label=\"Food on\" aria-pressed=\"true\">\u003cspan style=\"right: 3px\">\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cspan style=\"flex: 1; min-width: 0\">\u003cstrong style=\"font-size: 13px\">Check-ins\u003c/strong>\u003cp style=\"margin: 5px 0 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.5\">Sleep, soreness, energy before a session.\u003c/p>\u003c/span>\n        \u003cbutton type=\"button\" class=\"sw\" style=\"background: #8bd17c\" aria-label=\"Check-ins on\" aria-pressed=\"true\">\u003cspan style=\"right: 3px\">\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cspan style=\"flex: 1; min-width: 0\">\u003cstrong style=\"font-size: 13px\">Heart rate\u003c/strong>\u003cp style=\"margin: 5px 0 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.5\">Zones work without it, so this starts off.\u003c/p>\u003c/span>\n        \u003cbutton type=\"button\" class=\"sw\" style=\"background: #3a3a40\" aria-label=\"Heart rate off\" aria-pressed=\"false\">\u003cspan style=\"left: 3px\">\u003c/span>\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cspan style=\"flex: 1; min-width: 0\">\u003cstrong style=\"font-size: 13px\">Aches and pain\u003c/strong>\u003cp style=\"margin: 5px 0 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.5\">So a lift can be swapped while something hurts.\u003c/p>\u003c/span>\n        \u003cbutton type=\"button\" class=\"sw\" style=\"background: #8bd17c\" aria-label=\"Aches on\" aria-pressed=\"true\">\u003cspan style=\"right: 3px\">\u003c/span>\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 15px\">\n      \u003cp style=\"margin: 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.6\">Stored by AWS in the EU (Ireland), as our processor, only on our instructions. Coaching, not medical advice. \u003ca href=\"#privacy\">Read the policy\u003c/a>.\u003c/p>\n    \u003c/div>\n\n    \u003ca href=\"#today\" style=\"height: 48px; border-radius: 999px; background: #ff5b1f; color: #0e0e10; font-size: 14px; font-weight: 700; text-decoration: none; display: grid; place-items: center\">Save and continue\u003c/a>\n    \u003cbutton type=\"button\" style=\"height: 44px; border-radius: 999px; border: 1px solid #2e2e33; background: #131316; color: #f4f4f5; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">All off for now\u003c/button>\n  \u003c/div>\n\u003c/div>"},"PhoneContactPage":{"title":"Contact on a phone","w":390,"h":844,"html":"\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cheader style=\"padding: 16px 18px 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2e2e33\">\n    \u003ca href=\"#landing\" class=\"hd\" style=\"font-size: 18px; text-decoration: none; color: #f4f4f5\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/a>\n    \u003ca href=\"#landing\" style=\"font-size: 11.5px; color: #a1a1aa; text-decoration: none\">Close\u003c/a>\n  \u003c/header>\n\n  \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 16px\">\n    \u003cdiv>\n      \u003ch1 class=\"hd\" style=\"font-size: 30px\">Contact us\u003c/h1>\n      \u003cp style=\"margin: 11px 0 0; font-size: 13px; color: #a1a1aa; line-height: 1.6\">A person reads every message. Write in your own words; there\u2019s no wrong topic.\u003c/p>\n    \u003c/div>\n\n    \u003cform style=\"display: flex; flex-direction: column; gap: 18px\">\n        \u003cdiv>\n          \u003clabel for=\"ct\">What\u2019s it about?\u003c/label>\n          \u003cselect id=\"ct\">\n            \u003coption>Something\u2019s broken\u003c/option>\n            \u003coption>An idea\u003c/option>\n            \u003coption>Plan or billing\u003c/option>\n            \u003coption>Privacy request\u003c/option>\n            \u003coption>Something else\u003c/option>\n          \u003c/select>\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel for=\"cs\">Subject \u003cspan style=\"float: right; font-weight: 400; letter-spacing: 0\">0 / 200\u003c/span>\u003c/label>\n          \u003cinput id=\"cs\" type=\"text\" maxlength=\"200\">\n        \u003c/div>\n        \u003cdiv>\n          \u003clabel for=\"cm\">Message \u003cspan style=\"float: right; font-weight: 400; letter-spacing: 0\">0 / 2,000\u003c/span>\u003c/label>\n          \u003ctextarea id=\"cm\" maxlength=\"2000\">\u003c/textarea>\n        \u003c/div>\n        \u003cdiv style=\"font-size: 12px; color: #a1a1aa; line-height: 1.6\">\n          \u003cp style=\"margin: 0\">Reply to \u003cstrong style=\"color: #f4f4f5\">you@example.com\u003c/strong> \u00b7 your account email\u003c/p>\n          \u003cp style=\"margin: 6px 0 0\">Sent with this: the page you came from (Food), app version 2026.11.18, your browser \u00b7 \u003ca href=\"#contact\" style=\"font-size: 12px\">Remove\u003c/a>\u003c/p>\n          \u003cp style=\"margin: 6px 0 0\">Please don\u2019t include health details, passwords or API keys. We\u2019ll never ask for them.\u003c/p>\n        \u003c/div>\n        \u003cbutton type=\"button\" style=\"align-self: flex-start; height: 46px; padding: 0 26px; border-radius: 999px; border: 0; background: #ff5b1f; color: #0e0e10; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer\">Send\u003c/button>\n        \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa\">Pick a topic and write a message to send.\u003c/p>\n      \u003c/form>\n\n    \u003cdiv class=\"card\" style=\"padding: 15px\">\n      \u003cp class=\"lbl\" style=\"margin-bottom: 8px\">Agents don\u2019t use this form\u003c/p>\n      \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.6\">An agent holding your key calls \u003ccode style=\"color: #ff8a4c\">contact_support\u003c/code>, and reports API trouble with \u003ccode style=\"color: #ff8a4c\">report_issue\u003c/code>.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>"},"PhoneDuring":{"title":"During a session on a phone","w":390,"h":844,"html":"\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cheader style=\"padding: 16px 18px 10px; display: flex; flex-direction: column; gap: 11px\">\n    \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between\">\n      \u003ch1 class=\"hd\" style=\"font-size: 24px\">Legs\u003c/h1>\n      \u003cspan style=\"font-size: 11.5px; color: #ff8a4c\">\u003cspan style=\"color: #ff5b1f\">\u25cf\u003c/span> 24 min\u003c/span>\n    \u003c/div>\n    \u003cnav class=\"seg\">\n      \u003ca href=\"#before\">Before\u003c/a>\n      \u003ca class=\"on\" href=\"#during\">During\u003c/a>\n      \u003ca href=\"#after\">After\u003c/a>\n    \u003c/nav>\n  \u003c/header>\n\n  \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 12px\">\n    \u003cdiv class=\"card\" style=\"padding: 18px; border-color: #ff5b1f\">\n      \u003cp class=\"lbl\" style=\"color: #ff8a4c\">Next set\u003c/p>\n      \u003cp class=\"hd\" style=\"font-size: 36px; margin: 9px 0 5px\">100 kg \u00d7 5\u003c/p>\n      \u003cp style=\"margin: 0; font-size: 12.5px; color: #d4d4d8\">Back Squat \u00b7 set 3 of 3\u003c/p>\n      \u003cp style=\"margin: 7px 0 0; font-size: 11.5px; color: #a1a1aa\">15 a side \u00d7 2 plus the 20 kg bar. Rest about 3 min.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 13px\">\n      \u003cp class=\"lbl\">Log it by hand\u003c/p>\n      \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center\">\n        \u003clabel for=\"w\" style=\"font-size: 12.5px; color: #d4d4d8\">Weight\u003c/label>\n        \u003cspan class=\"stepper\">\u003cbutton type=\"button\" aria-label=\"Less weight\">\u2212\u003c/button>\u003cinput id=\"w\" value=\"100\" style=\"width: 56px; text-align: center; background: #0e0e10; border: 1px solid #2e2e33; border-radius: 10px; color: #f4f4f5; font-family: inherit; font-size: 14px; padding: 7px 0; font-variant-numeric: tabular-nums\">\u003cbutton type=\"button\" aria-label=\"More weight\">+\u003c/button>\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center\">\n        \u003clabel for=\"r\" style=\"font-size: 12.5px; color: #d4d4d8\">Reps\u003c/label>\n        \u003cspan class=\"stepper\">\u003cbutton type=\"button\" aria-label=\"Fewer reps\">\u2212\u003c/button>\u003cinput id=\"r\" value=\"5\" style=\"width: 56px; text-align: center; background: #0e0e10; border: 1px solid #2e2e33; border-radius: 10px; color: #f4f4f5; font-family: inherit; font-size: 14px; padding: 7px 0; font-variant-numeric: tabular-nums\">\u003cbutton type=\"button\" aria-label=\"More reps\">+\u003c/button>\u003c/span>\n      \u003c/div>\n      \u003cdiv>\n        \u003cp class=\"lbl\" style=\"margin-bottom: 8px\">How hard?\u003c/p>\n        \u003cdiv style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n          \u003cbutton type=\"button\" style=\"padding: 8px 0; border-radius: 999px; border: 1px solid #2e2e33; background: none; color: #a1a1aa; font-family: inherit; font-size: 11px; cursor: pointer\">Easy\u003c/button>\n          \u003cbutton type=\"button\" style=\"padding: 8px 0; border-radius: 999px; border: 1px solid #f4f4f5; background: #f4f4f5; color: #0e0e10; font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer\">Good\u003c/button>\n          \u003cbutton type=\"button\" style=\"padding: 8px 0; border-radius: 999px; border: 1px solid #2e2e33; background: none; color: #a1a1aa; font-family: inherit; font-size: 11px; cursor: pointer\">Hard\u003c/button>\n          \u003cbutton type=\"button\" style=\"padding: 8px 0; border-radius: 999px; border: 1px solid #2e2e33; background: none; color: #a1a1aa; font-family: inherit; font-size: 11px; cursor: pointer\">All out\u003c/button>\n        \u003c/div>\n      \u003c/div>\n      \u003cbutton type=\"button\" style=\"height: 44px; border-radius: 999px; border: 0; background: #ff5b1f; color: #0e0e10; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer\">Log the set\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px\">\n      \u003cp class=\"lbl\" style=\"margin-bottom: 7px\">Logged so far\u003c/p>\n      \u003cdiv class=\"set\">\u003cspan>Back Squat \u003cspan style=\"color: #a1a1aa\">warm-up\u003c/span>\u003c/span>\u003cspan style=\"color: #a1a1aa; font-variant-numeric: tabular-nums\">60 \u00d7 8\u003c/span>\u003c/div>\n      \u003cdiv class=\"set\">\u003cspan>Back Squat \u003cspan style=\"color: #a1a1aa\">1\u003c/span>\u003c/span>\u003cspan style=\"font-variant-numeric: tabular-nums\">100 \u00d7 5 \u00b7 Easy\u003c/span>\u003c/div>\n      \u003cdiv class=\"set\">\u003cspan>Back Squat \u003cspan style=\"color: #a1a1aa\">2\u003c/span>\u003c/span>\u003cspan style=\"font-variant-numeric: tabular-nums\">100 \u00d7 5 \u00b7 Good\u003c/span>\u003c/div>\n      \u003cdiv class=\"set\" style=\"border: 0\">\u003cspan>Romanian Deadlift \u003cspan style=\"color: #a1a1aa\">1\u003c/span>\u003c/span>\u003cspan style=\"font-variant-numeric: tabular-nums\">80 \u00d7 8 \u00b7 Good\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cbutton type=\"button\" style=\"height: 44px; border-radius: 999px; border: 1px solid #2e2e33; background: #131316; color: #f4f4f5; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer\">End session\u003c/button>\n  \u003c/div>\n\u003c/div>"},"PhoneFood":{"title":"Foo span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cp class=\"lbl\" style=\"margin-top: 4px\">Benchmark\u003c/p>\n    \u003cdiv class=\"card\" style=\"padding: 16px\">\n      \u003cdiv style=\"display: flex; justify-content: space-between; align-items: baseline\">\n        \u003cstrong style=\"font-size: 13px\">Max push-ups\u003c/strong>\n        \u003cspan style=\"font-size: 11.5px; color: #8bd17c\">34 \u00b7 +4\u003c/span>\n      \u003c/div>\n      \u003cp style=\"margin: 7px 0 0; font-size: 11.5px; color: #a1a1aa\">Every 6 weeks \u00b7 next in 12 days\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cnav class=\"tabs\">\n    \u003ca href=\"#today\">\u003cspan class=\"dot\">\u003c/span>Today\u003c/a>\n    \u003ca href=\"#sessions\">\u003cspan class=\"dot\">\u003c/span>Training\u003c/a>\n    \u003ca href=\"#food\">\u003cspan class=\"dot\">\u003c/span>Food\u003c/a>\n    \u003ca href=\"#body\">\u003cspan class=\"dot\">\u003c/span>Body\u003c/a>\n    \u003ca class=\"on\" href=\"#goals\">\u003cspan class=\"dot\">\u003c/span>Goals\u003c/a>\n  \u003c/nav>\n\u003c/div>"},"PhoneLanding":{"title":"Landing on a phone","w":390,"h":844,"html":"\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cheader style=\"padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2e2e33\">\n    \u003cspan class=\"hd\" style=\"font-size: 18px\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/span>\n    \u003ca href=\"#signin\" style=\"font-size: 12.5px; color: #f4f4f5; text-decoration: none; font-weight: 600\">Sign in\u003c/a>\n  \u003c/header>\n\n  \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 16px\">\n    \u003cp class=\"lbl\">Works with Claude, ChatGPT and Grok\u003c/p>\n    \u003ch1 class=\"hd\" style=\"font-size: 40px; text-wrap: balance\">Your AI is now your trainer\u003c/h1>\n    \u003cp style=\"margin: 0; font-size: 14px; color: #d4d4d8; line-height: 1.55\">Tell Claude, ChatGPT or any agent what you did. It logs it, coaches you, and this is what you see.\u003c/p>\n\n    \u003ca href=\"#signin\" style=\"height: 48px; border-radius: 999px; background: #ff5b1f; color: #0e0e10; font-size: 14.5px; font-weight: 700; text-decoration: none; display: grid; place-items: center\">Create a free account\u003c/a>\n\n    \u003cdiv class=\"card\" style=\"padding: 15px; display: flex; flex-direction: column; gap: 10px\">\n      \u003cdiv style=\"align-self: flex-end; max-width: 82%; background: #ff5b1f; color: #0e0e10; padding: 9px 13px; border-radius: 16px 16px 4px 16px; font-size: 13px; font-weight: 600\">Squat 100 kg for 5, 5, 5\u003c/div>\n      \u003cdiv style=\"align-self: flex-start; max-width: 90%; background: #131316; border: 1px solid #2e2e33; padding: 9px 13px; border-radius: 16px 16px 16px 4px; font-size: 13px; line-height: 1.5; color: #d4d4d8\">Logged. That\u2019s 2.5 kg up on last Thursday, same reps.\u003cbr>\u003cspan style=\"color: #f4f4f5; font-weight: 600\">Next: 100 \u00d7 5. Rest about 3 minutes.\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 15px\">\n      \u003cdiv style=\"display: flex; justify-content: space-between; margin-bottom: 10px\">\n        \u003cspan style=\"font-size: 11px; color: #a1a1aa\">\u003cspan style=\"color: #ff5b1f\">\u25cf\u003c/span> Live \u00b7 Legs \u00b7 24 min\u003c/span>\n        \u003cspan style=\"font-size: 11px; color: #8bd17c; font-weight: 600\">Ahead\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px; font-size: 12px\">\n        \u003cdiv style=\"display: flex; justify-content: space-between\">\u003cspan>Squat\u003c/span>\u003cspan style=\"font-variant-numeric: tabular-nums\">100 \u00d7 5 \u00d73 \u003cspan style=\"color: #a1a1aa\">\u00b7 97.5\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; justify-content: space-between\">\u003cspan>Romanian deadlift\u003c/span>\u003cspan style=\"font-variant-numeric: tabular-nums\">80 \u00d7 8 \u003cspan style=\"color: #a1a1aa\">\u00b7 80\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv style=\"display: flex; justify-content: space-between; color: #a1a1aa\">\u003cspan>Leg press\u003c/span>\u003cspan style=\"font-variant-numeric: tabular-nums\">next \u00b7 160 \u00d7 10\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cp class=\"lbl\" style=\"margin-top: 4px\">Not just the gym\u003c/p>\n    \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 7px\">\n      \u003cspan class=\"chip\">Lifts\u003c/span>\u003cspan class=\"chip\">Runs\u003c/span>\u003cspan class=\"chip\">Rides\u003c/span>\u003cspan class=\"chip\">Swims\u003c/span>\u003cspan class=\"chip\">Hikes\u003c/span>\u003cspan class=\"chip\">Mobility\u003c/span>\n    \u003c/div>\n\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; color: #a1a1aa; line-height: 1.5; margin-top: 4px\">\n      \u003cp style=\"margin: 0\">\u003cspan style=\"color: #8bd17c\">\u2713\u003c/span> Progressive overload, effort (RPE) and planned deloads\u003c/p>\n      \u003cp style=\"margin: 0\">\u003cspan style=\"color: #8bd17c\">\u2713\u003c/span> Your data is yours: export any time, delete in one tap\u003c/p>\n      \u003cp style=\"margin: 0\">\u003cspan style=\"color: #8bd17c\">\u2713\u003c/span> Coaching, not medical advice\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 15px; margin-top: 4px\">\n      \u003cp class=\"lbl\" style=\"margin-bottom: 8px\">Pro is free while we\u2019re in early access\u003c/p>\n      \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.55\">Everything is on: your whole history, several agents, the coach. You\u2019ll know at least 14 days before pricing starts.\u003c/p>\n    \u003c/div>\n\n    \u003cnav style=\"display: flex; flex-wrap: wrap; gap: 16px; font-size: 11.5px; padding-top: 6px; border-top: 1px solid #2e2e33; margin-top: 4px\">\n      \u003ca href=\"#privacy\" style=\"text-decoration: none\">Privacy\u003c/a>\n      \u003ca href=\"#privacy\" style=\"text-decoration: none\">Terms\u003c/a>\n      \u003ca href=\"#contact\" style=\"text-decoration: none\">Contact\u003c/a>\n      \u003cspan style=\"color: #52525b\">\u00a9 2026 Shredpace\u003c/span>\n    \u003c/nav>\n  \u003c/div>\n\u003c/div>"},"PhoneMore":{"title":"More","w":390,"h":844,"html":"\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: #0e0e10\">\n\n  \u003cdiv style=\"flex: 1; min-height: 0; padding: 20px 18px; opacity: .3; pointer-events: none\" aria-hidden=\"true\">\n    \u003ch1 class=\"hd\" style=\"font-size: 27px\">Today\u003c/h1>\n    \u003cp style=\"margin: 4px 0 0; font-size: 11.5px; color: #a1a1aa\">Tue 17 Nov \u00b7 Legs planned\u003c/p>\n  \u003c/div>\n\n  \u003cdiv class=\"sheet\">\n    \u003cdiv style=\"width: 38px; height: 4px; border-radius: 999px; background: #3a3a40; margin: 6px auto 16px\">\u003c/div>\n    \u003cdiv style=\"display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #2e2e33\">\n      \u003cspan style=\"width: 40px; height: 40px; border-radius: 999px; background: #131316; border: 1px solid #2e2e33; display: grid; place-items: center; font-weight: 700; font-size: 14px\">S\u003c/span>\n      \u003cspan style=\"min-width: 0; flex: 1\">\n        \u003cstrong style=\"font-size: 14px; display: block\">Sam\u003c/strong>\n        \u003cspan style=\"font-size: 11.5px; color: #a1a1aa\">sam@example.com\u003c/span>\n      \u003c/span>\n      \u003cspan style=\"font-size: 10px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,91,31,.15); color: #ff8a4c\">Early Pro\u003c/span>\n    \u003c/div>\n    \u003ca class=\"r\" href=\"#plan\">\u003cspan>Your plan\u003c/span>\u003cspan class=\"ch\">Set it up \u203a\u003c/span>\u003c/a>\n    \u003ca class=\"r\" href=\"#coach\">\u003cspan>Coach\u003c/span>\u003cspan class=\"ch\">\u203a\u003c/span>\u003c/a>\n    \u003ca class=\"r\" href=\"#connect\">\u003cspan>Your agents\u003c/span>\u003cspan class=\"ch\">Claude \u203a\u003c/span>\u003c/a>\n    \u003ca class=\"r\" href=\"#activity\">\u003cspan>What changed\u003c/span>\u003cspan class=\"ch\">\u203a\u003c/span>\u003c/a>\n    \u003ca class=\"r\" href=\"#account\">\u003cspan>Settings\u003c/span>\u003cspan class=\"ch\">\u203a\u003c/span>\u003c/a>\n    \u003ca class=\"r\" href=\"#account-appearance\">\u003cspan>Appearance\u003c/span>\u003cspan class=\"ch\">Ember \u00b7 dark \u203a\u003c/span>\u003c/a>\n    \u003ca class=\"r\" href=\"#billing\">\u003cspan>Subscription\u003c/span>\u003cspan class=\"ch\">Pro \u203a\u003c/span>\u003c/a>\n    \u003ca class=\"r\" href=\"#contact\">\u003cspan>Contact us\u003c/span>\u003cspan class=\"ch\">\u203a\u003c/span>\u003c/a>\n    \u003ca href=\"#landing\" style=\"display: grid; place-items: center; height: 46px; margin-top: 16px; border-radius: 999px; border: 1px solid #2e2e33; background: #131316; font-size: 13.5px; font-weight: 700; text-decoration: none\">Sign out\u003c/a>\n  \u003c/div>\n\u003c/div>"},"PhoneProCoach":{"title":"Coach on a phone","w":390,"h":844,"html":"\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cheader style=\"padding: 18px 18px 10px; display: flex; align-items: baseline; justify-content: space-between\">\n    \u003cdiv>\n      \u003ch1 class=\"hd\" style=\"font-size: 27px\">Coach\u003c/h1>\n      \u003cp style=\"margin: 4px 0 0; font-size: 11.5px; color: #a1a1aa\">Checked this morning\u003c/p>\n    \u003c/div>\n    \u003cspan class=\"tag\" style=\"background: rgba(255,91,31,.14); color: #ff8a4c\">Pro\u003c/span>\n  \u003c/header>\n\n  \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 12px\">\n    \u003cdiv style=\"display: flex; gap: 9px\">\n      \u003cspan style=\"flex: 1; text-align: center; padding: 10px 0; border-radius: 13px; background: #131316; border: 1px solid #2e2e33; font-size: 10.5px; color: #a1a1aa\">Stalls\u003cbr>\u003cstrong class=\"hd\" style=\"font-size: 18px; color: #f6c445\">1\u003c/strong>\u003c/span>\n      \u003cspan style=\"flex: 1; text-align: center; padding: 10px 0; border-radius: 13px; background: #131316; border: 1px solid #2e2e33; font-size: 10.5px; color: #a1a1aa\">Balance\u003cbr>\u003cstrong class=\"hd\" style=\"font-size: 18px; color: #f6c445\">Off\u003c/strong>\u003c/span>\n      \u003cspan style=\"flex: 1; text-align: center; padding: 10px 0; border-radius: 13px; background: #131316; border: 1px solid #2e2e33; font-size: 10.5px; color: #a1a1aa\">Load\u003cbr>\u003cstrong class=\"hd\" style=\"font-size: 18px; color: #8bd17c\">OK\u003c/strong>\u003c/span>\n    \u003c/div>\n\n    \u003cp class=\"lbl\">This week\u2019s insights\u003c/p>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px; border-color: #f6c445; display: flex; flex-direction: column; gap: 11px\">\n      \u003cspan class=\"tag\" style=\"background: rgba(246,196,69,.16); color: #f6c445; align-self: flex-start\">Stall\u003c/span>\n      \u003cstrong style=\"font-size: 14px; line-height: 1.35\">Bench Press hasn\u2019t moved in 3 weeks\u003c/strong>\n      \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.55\">82.5 \u00d7 6 three sessions running, effort climbing from Good to All out. A week about 20% lighter, then back at 82.5 for 5.\u003c/p>\n      \u003cdiv style=\"display: flex; gap: 8px\">\u003cbutton type=\"button\" class=\"btn go\">Accept\u003c/button>\u003cbutton type=\"button\" class=\"btn\">Dismiss\u003c/button>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px; border-color: #f6c445; display: flex; flex-direction: column; gap: 11px\">\n      \u003cspan class=\"tag\" style=\"background: rgba(246,196,69,.16); color: #f6c445; align-self: flex-start\">Balance\u003c/span>\n      \u003cstrong style=\"font-size: 14px; line-height: 1.35\">You press about twice as much as you pull\u003c/strong>\n      \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.55\">34 pressing sets against 18 pulling over four weeks. One row day, or two rowing sets per Push, evens it out.\u003c/p>\n      \u003cdiv style=\"display: flex; gap: 8px\">\u003cbutton type=\"button\" class=\"btn go\">Balance my week\u003c/button>\u003cbutton type=\"button\" class=\"btn\">Dismiss\u003c/button>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n      \u003cspan class=\"tag\" style=\"background: rgba(139,209,124,.16); color: #8bd17c; align-self: flex-start\">Load\u003c/span>\n      \u003cstrong style=\"font-size: 14px; line-height: 1.35\">Your load is in the sweet spot\u003c/strong>\n      \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.55\">18,420 kg this week against a four-week average of 17,800. Climbing, but not faster than you recover.\u003c/p>\n    \u003c/div>\n\n    \u003cp style=\"margin: 0; font-size: 11px; color: #a1a1aa; line-height: 1.5\">Accepting a stall insight plans the step-back and your week changes with it.\u003c/p>\n  \u003c/div>\n\n  \u003cnav class=\"tabs\">\n    \u003ca href=\"#today\">\u003cspan class=\"dot\">\u003c/span>Today\u003c/a>\n    \u003ca href=\"#sessions\">\u003cspan class=\"dot\">\u003c/span>Training\u003c/a>\n    \u003ca href=\"#food\">\u003cspan class=\"dot\">\u003c/span>Food\u003c/a>\n    \u003ca href=\"#body\">\u003cspan class=\"dot\">\u003c/span>Body\u003c/a>\n    \u003ca href=\"#goals\">\u003cspan class=\"dot\">\u003c/span>Goals\u003c/a>\n  \u003c/nav>\n\u003c/div>"},"PhoneProPrograms":{"title":"Programs on a phone","w":390,"h":844,"html":"\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden\">\n  \u003cheader style=\"padding: 16px 18px 10px\">\n    \u003ca href=\"#more\" style=\"font-size: 11.5px; text-decoration: none\">\u2039 More\u003c/a>\n    \u003cdiv style=\"display: flex; align-items: baseline; justify-content: space-between; margin-top: 9px\">\n      \u003ch1 class=\"hd\" style=\"font-size: 26px\">Programs\u003c/h1>\n      \u003cspan style=\"font-size: 10px; letter-spacing: .09em; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(255,91,31,.14); color: #ff8a4c\">Pro\u003c/span>\n    \u003c/div>\n  \u003c/header>\n\n  \u003cdiv style=\"flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 12px\">\n    \u003cdiv class=\"card\" style=\"padding: 16px; border-color: #ff5b1f\">\n      \u003cp class=\"lbl\">Running now\u003c/p>\n      \u003ch2 class=\"hd\" style=\"font-size: 21px; margin: 9px 0 5px\">Autumn strength\u003c/h2>\n      \u003cp style=\"margin: 0 0 14px; font-size: 11.5px; color: #a1a1aa\">12 weeks \u00b7 week 9 \u00b7 Peak block\u003c/p>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px\">\n        \u003cspan class=\"wk done\">1\u003c/span>\u003cspan class=\"wk done\">2\u003c/span>\u003cspan class=\"wk done\">3\u003c/span>\u003cspan class=\"wk done\">4\u003c/span>\u003cspan class=\"wk done\">5\u003c/span>\u003cspan class=\"wk de\">6\u003c/span>\n        \u003cspan class=\"wk done\">7\u003c/span>\u003cspan class=\"wk done\">8\u003c/span>\u003cspan class=\"wk now\">\u003cstrong>9\u003c/strong>\u003c/span>\u003cspan class=\"wk\">10\u003c/span>\u003cspan class=\"wk\">11\u003c/span>\u003cspan class=\"wk de\">12\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 11px; margin-top: 13px; font-size: 10.5px; color: #a1a1aa\">\n        \u003cspan>Base 1\u20133\u003c/span>\u003cspan>Build 4\u20136\u003c/span>\u003cspan>Peak 7\u20139\u003c/span>\u003cspan>Taper 10\u201312\u003c/span>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px\">\n      \u003cp class=\"lbl\" style=\"margin-bottom: 6px\">This week\u003c/p>\n      \u003cdiv class=\"d\">\u003cspan>\u003cstrong>Mon\u003c/strong> \u00b7 Legs\u003c/span>\u003cspan style=\"color: #a1a1aa; font-variant-numeric: tabular-nums\">12 sets \u00b7 85%\u003c/span>\u003c/div>\n      \u003cdiv class=\"d\">\u003cspan>\u003cstrong>Wed\u003c/strong> \u00b7 Push\u003c/span>\u003cspan style=\"color: #a1a1aa; font-variant-numeric: tabular-nums\">13 sets \u00b7 82%\u003c/span>\u003c/div>\n      \u003cdiv class=\"d\">\u003cspan>\u003cstrong>Thu\u003c/strong> \u00b7 Easy run\u003c/span>\u003cspan style=\"color: #a1a1aa\">8 km \u00b7 zone 2\u003c/span>\u003c/div>\n      \u003cdiv class=\"d\">\u003cspan>\u003cstrong>Fri\u003c/strong> \u00b7 Pull\u003c/span>\u003cspan style=\"color: #a1a1aa; font-variant-numeric: tabular-nums\">12 sets \u00b7 87%\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 16px\">\n      \u003cp class=\"lbl\" style=\"margin-bottom: 8px\">Notes on this block\u003c/p>\n      \u003cp style=\"margin: 0; font-size: 12px; color: #a1a1aa; line-height: 1.6\">Peak holds the volume down and the weight up. If a lift stalls here, the coach plans the step-back rather than pushing through it.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv style=\"display: flex; gap: 8px\">\u003cbutton type=\"button\" class=\"btn\">Edit\u003c/button>\u003cbutton type=\"button\" class=\"btn\">End early\u003c/button>\u003c/div>\n    \u003cp style=\"margin: 0; font-size: 11px; color: #a1a1aa; line-height: 1.5\">A program you trained in is ended early, not removed \u2014 the sessions stay attached to it.\u003c/p>\n  \ u003c/span>\u003cspan style=\"min-width: 0\">\u003cstrong style=\"font-size: 14px; display: block\">Connect your agent\u003c/strong>\u003cspan style=\"font-size: 12px; color: #67676b\">Claude, ChatGPT or Grok. One click, no key to copy.\u003c/span>\u003c/span>\u003c/a>\n          \u003ca class=\"step\" href=\"#plan-setup\">\u003cspan class=\"dot\">2\u003c/span>\u003cspan style=\"min-width: 0\">\u003cstrong style=\"font-size: 14px; display: block\">Set up your plan\u003c/strong>\u003cspan style=\"font-size: 12px; color: #67676b\">What you train for, how fast, and how much time you give it.\u003c/span>\u003c/span>\u003c/a>\n          \u003ca class=\"step\" href=\"#body\">\u003cspan class=\"dot\">3\u003c/span>\u003cspan style=\"min-width: 0\">\u003cstrong style=\"font-size: 14px; display: block\">Your first weigh-in\u003c/strong>\u003cspan style=\"font-size: 12px; color: #67676b\">Tell your agent your weight. It becomes your starting point.\u003c/span>\u003c/span>\u003c/a>\n        \u003c/div>\n\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n          \u003cp class=\"lbl\">When you\u2019re at the gym\u003c/p>\n          \u003cdiv class=\"copy\">\u003ccode>\u201cStarting my session: I\u2019m at the gym\u201d\u003c/code>\u003cbutton type=\"button\">Copy\u003c/button>\u003c/div>\n          \u003cp style=\"margin: 0; font-size: 12px; color: #67676b; line-height: 1.5\">Paste it into your agent\u2019s chat. It starts the session when you say you\u2019re there, then logs each set as you go.\u003c/p>\n        \u003c/div>\n\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\">\n          \u003cp class=\"lbl\">What fills in after your first session\u003c/p>\n          \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n            \u003cdiv class=\"tile g\">\u003cb>This week\u003c/b>\u003cspan>To come\u003c/span>\u003c/div>\n            \u003cdiv class=\"tile o\">\u003cb>Volume\u003c/b>\u003cspan>To come\u003c/span>\u003c/div>\n            \u003cdiv class=\"tile\">\u003cb>Strength\u003c/b>\u003cspan>To come\u003c/span>\u003c/div>\n            \u003cdiv class=\"tile\">\u003cb>New bests\u003c/b>\u003cspan>To come\u003c/span>\u003c/div>\n            \u003cdiv class=\"tile p\">\u003cb>Streak\u003c/b>\u003cspan>To come\u003c/span>\u003c/div>\n            \u003cdiv class=\"tile\">\u003cb>Time trained\u003c/b>\u003cspan>To come\u003c/span>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv style=\"flex: 0 1 290px; min-width: 240px; display: flex; flex-direction: column; gap: 14px; align-items: center\">\n        \u003cdiv class=\"panel\" style=\"width: 100%; box-sizing: border-box; padding: 18px 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 12px\">\n          \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center; width: 100%\">\u003cp class=\"lbl\">This week\u003c/p>\n            \u003cspan class=\"seg\">\u003cbutton type=\"button\" class=\"on\">Front\u003c/button>\u003cbutton type=\"button\">Back\u003c/button>\u003c/span>\u003c/div>\n          \u003csvg viewBox=\"0 0 120 250\" width=\"150\" height=\"312\" role=\"img\" aria-label=\"Body figure with no muscles trained yet\">\n            \u003cg fill=\"#e6e0d9\">\n              \u003ccircle cx=\"60\" cy=\"20\" r=\"14\"/>\n              \u003crect x=\"40\" y=\"40\" width=\"40\" height=\"68\" rx=\"16\"/>\n              \u003crect x=\"16\" y=\"44\" width=\"20\" height=\"74\" rx=\"10\"/>\n              \u003crect x=\"84\" y=\"44\" width=\"20\" height=\"74\" rx=\"10\"/>\n              \u003crect x=\"42\" y=\"110\" width=\"17\" height=\"124\" rx=\"8\"/>\n              \u003crect x=\"61\" y=\"110\" width=\"17\" height=\"124\" rx=\"8\"/>\n            \u003c/g>\n          \u003c/svg>\n          \u003cp style=\"margin: 0; font-size: 11.5px; color: #67676b; text-align: center; line-height: 1.5\">Drag to turn \u00b7 Fewer sets \u2194 More\u003cbr>Nothing trained yet this week. Tracked by your agent, set by set.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cp style=\"margin: 0; font-size: 11.5px; color: #67676b; line-height: 1.55; max-width: 90ch\">The first-run state is reconstructed from the 26\u201327 Oct changelog; the board name StudioNew appears in the shipped code. The rail, the six tile names and their tints, the greeting and the copy-sentence style were observed on a live Studio account on 18 Nov. The body figure here is a placeholder for the real anatomical illustration; the tints are approximate.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"TodayComeback":{"title":"Today: the comeback question","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside style=\"flex: 0 0 232px; min-width: 0; border-right: 1px solid #2e2e33; padding: 22px 16px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box\">\n    \u003cspan class=\"hd\" style=\"font-size: 19px; padding: 0 8px\">Shred\u003cspan style=\"color: #ff5b1f\">pace\u003c/span>\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\n      \u003ca class=\"on\" href=\"#today\">Today\u003c/a>\n      \u003ca href=\"#sessions\">Sessions\u003c/a>\n      \u003ca href=\"#progress\">Progress\u003c/a>\n      \u003ca href=\"#exercises\">Exercises\u003c/a>\n      \u003ca href=\"#plan\">Your plan\u003c/a>\n      \u003ca href=\"#coach\">Coach\u003c/a>\n      \u003ca href=\"#food\">Food\u003c/a>\n      \u003ca href=\"#body\">Body\u003c/a>\n      \u003ca href=\"#goals\">Goals\u003c/a>\n      \u003ca href=\"#activity\">What changed\u003c/a>\n      \u003ca href=\"#account\">Settings\u003c/a>\n    \u003c/nav>\n  \u003c/aside>\n\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box\">\n    \u003cdiv>\n      \u003ch1 class=\"hd\" style=\"font-size: 34px\">Today\u003c/h1>\n      \u003cp style=\"margin: 6px 0 0; font-size: 13px; color: #a1a1aa; max-width: 70ch; line-height: 1.55\">The comeback question, asked once on the first session day back, together with the check-in. Answer your agent, or answer here. The three kinds below are three days, not three cards.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n      \u003cp class=\"lbl\">Short break \u00b7 up to 3 weeks\u003c/p>\n      \u003ch2 class=\"hd\" style=\"font-size: 22px\">Back after 4 days off\u003c/h2>\n      \u003cp style=\"margin: 0; font-size: 13.5px; line-height: 1.5\">Same weights as last time, or ease in?\u003c/p>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px\">\u003cbutton type=\"button\" class=\"btn on\">Same weights\u003c/button>\u003cbutton type=\"button\" class=\"btn\">Ease in\u003c/button>\u003c/div>\n      \u003cp class=\"say\">\u003cstrong style=\"color: #f4f4f5\">If same:\u003c/strong> Same weights as last time, as you said. Each set follows what you lift.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n      \u003cp class=\"lbl\">Long break \u00b7 over 3 weeks \u00b7 ease in is offered first\u003c/p>\n      \u003ch2 class=\"hd\" style=\"font-size: 22px\">Back after 5 weeks off\u003c/h2>\n      \u003cp style=\"margin: 0; font-size: 13.5px; line-height: 1.5\">Ease in, or same weights as last time?\u003c/p>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px\">\u003cbutton type=\"button\" class=\"btn on\">Ease in\u003c/button>\u003cbutton type=\"button\" class=\"btn\">Same weights\u003c/button>\u003c/div>\n      \u003cp class=\"say\">\u003cstrong style=\"color: #f4f4f5\">If ease in:\u003c/strong> Easing in, about 10% lighter, as you said. Each set follows what you lift.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" style=\"padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n      \u003cp class=\"lbl\">After being ill \u00b7 replaces \u201cFully recovered?\u201d\u003c/p>\n      \u003ch2 class=\"hd\" style=\"font-size: 22px\">Back after 10 days off ill\u003c/h2>\n      \u003cp style=\"margin: 0; font-size: 13.5px; line-height: 1.5\">Ease in, or same weights as last time if you feel fully recovered?\u003c/p>\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px\">\u003cbutton type=\"button\" class=\"btn on\">Ease in\u003c/button>\u003cbutton type=\"button\" class=\"btn\">Same weights, fully recovered\u003c/button>\u003c/div>\n      \u003cp class=\"say\">\u003cstrong style=\"color: #f4f4f5\">Easing after illness is about 20% lighter, not 10%.\u003c/strong> Saying \u201csame\u201d also ends the lighter week.\u003c/p>\n    \u003c/div>\n\n    \u003cp style=\"margin: 0; font-size: 11.5px; color: #a1a1aa; line-height: 1.55\">Reconstructed from the agent guide and the 17 Nov changelog entry. The question wording and the two replies are quoted from the guide; the buttons and layout are ours. This state has no board name in the shipped code.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"TodayDesktop":{"title":"Today","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside style=\"flex: 0 0 218px; min-width: 0; border-right: 1px solid #ececea; padding: 24px 14px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; background: #f7f7f5\">\n    \u003cspan style=\"font-size: 17px; font-weight: 700; padding: 0 10px; letter-spacing: -.02em\">Shredpace\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca class=\"on\" href=\"#today\">Today\u003c/a>\u003ca href=\"#sessions\">Training\u003c/a>\u003ca href=\"#food\">Food\u003c/a>\u003ca href=\"#body\">Body\u003c/a>\u003ca href=\"#goals\">Goals\u003c/a>\u003c/nav>\n    \u003cdiv>\u003cp class=\"lbl\" style=\"padding: 0 10px; margin-bottom: 6px\">Tools\u003c/p>\u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#connect\">Ask Claude\u003c/a>\u003ca href=\"#connect\">Your agents\u003c/a>\u003ca href=\"#coach\">Coach\u003c/a>\u003ca href=\"#account\">Settings\u003c/a>\u003c/nav>\u003c/div>\n    \u003ca href=\"#connect\" class=\"panel\" style=\"margin-top: auto; padding: 12px 14px; text-decoration: none; display: block\">\u003cstrong style=\"font-size: 12px; color: #141416; display: block\">Claude is connected\u003c/strong>\u003cspan style=\"font-size: 11.5px; color: #67676b; line-height: 1.5\">Last heard 18:02 \u00b7 logs every set you send\u003c/span>\u003c/a>\n  \u003c/aside>\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 18px 34px 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box\">\n\u003cdiv style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\u003cdiv>\u003cp class=\"mut\" style=\"font-size: 15px\">Hello,\u003c/p>\u003ch1 style=\"font-size: 34px; margin-top: 2px\">Sam.\u003c/h1>\u003cp class=\"mut\" style=\"font-size: 13px; margin-top: 6px\">Here\u2019s your training today.\u003c/p>\u003c/div>\u003cdiv style=\"display: flex; gap: 12px; align-items: center; min-height: 44px\">\u003cspan style=\"font-size: 11.5px; color: #67676b\">Wed, Nov 18, 2026\u003c/span>\u003cspan class=\"av\">S\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start\">\n      \u003cdiv class=\"panel\" style=\"flex: 0 0 236px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px\">\n        \u003cdiv style=\"display: flex; justify-content: space-between; align-items: center; width: 100%\">\u003cspan class=\"lbl\">Drag to turn\u003c/span>\u003cspan class=\"seg\">\u003cbutton type=\"button\" class=\"on\">Front\u003c/button>\u003cbutton type=\"button\">Back\u003c/button>\u003c/span>\u003c/div>\n        \u003csvg viewBox=\"0 0 120 250\" width=\"132\" height=\"275\" role=\"img\" aria-label=\"Body figure, quads tinted for this week's sets\">\n      \u003cg fill=\"#e6e0d9\">\u003ccircle cx=\"60\" cy=\"19\" r=\"13\"/>\u003crect x=\"38\" y=\"38\" width=\"44\" height=\"70\" rx=\"17\"/>\u003crect x=\"14\" y=\"42\" width=\"20\" height=\"76\" rx=\"10\"/>\u003crect x=\"86\" y=\"42\" width=\"20\" height=\"76\" rx=\"10\"/>\u003c/g>\n      \u003cg>\u003crect x=\"40\" y=\"110\" width=\"18\" height=\"70\" rx=\"9\" fill=\"#e8a39a\"/>\u003crect x=\"62\" y=\"110\" width=\"18\" height=\"70\" rx=\"9\" fill=\"#e8a39a\"/>\n      \u003crect x=\"41\" y=\"182\" width=\"16\" height=\"54\" rx=\"8\" fill=\"#e6e0d9\"/>\u003crect x=\"63\" y=\"182\" width=\"16\" height=\"54\" rx=\"8\" fill=\"#e6e0d9\"/>\u003c/g>\n    \u003c/svg>\n        \u003cp style=\"font-size: 11.5px; color: #67676b; text-align: center; line-height: 1.5\">Quads \u00b7 3 sets \u00b7 Wednesday\u003cbr>Fewer sets \u2194 More\u003cbr>Tracked by your agent, set by set.\u003c/p>\n      \u003c/div>\n      \u003cdiv style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n        \u003cdiv class=\"panel\" style=\"padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start\">\u003cspan style=\"width: 28px; height: 28px; border-radius: 999px; border: 1px solid #ececea; display: grid; place-items: center; flex: 0 0 auto; font-size: 13px; color: #67676b\" aria-hidden=\"true\">\u25ce\u003c/span>\u003cdiv style=\"flex: 1; min-width: 0\">\u003cdiv style=\"display: flex; justify-content: space-between; gap: 12px\">\u003cstrong style=\"font-size: 13.5px\">Recomp \u00b7 week 1 of 12\u003c/strong>\u003c/div>\u003cdiv style=\"font-size: 12.5px; color: #67676b; line-height: 1.5; margin-top: 4px\">\u003cstrong style='color:#141416'>Early days.\u003c/strong> Weight 82.3 \u2192 82.3 kg. Normal in the first weeks: more food around training and more water in the muscles. We judge a recomp from week 4, by your waist and your lifts. Waist: 84 cm \u00b7 18 Nov\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel\" style=\"padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start\">\u003cspan style=\"width: 28px; height: 28px; border-radius: 999px; border: 1px solid #ececea; display: grid; place-items: center; flex: 0 0 auto; font-size: 13px; color: #67676b\" aria-hidden=\"true\">\u25a3\u003c/span>\u003cdiv style=\"flex: 1; min-width: 0\">\u003cdiv style=\"display: flex; justify-content: space-between; gap: 12px\">\u003cstrong style=\"font-size: 13.5px\">Week 1: finding your weights\u003c/strong>\u003cspan style=\"font-size: 12px; font-weight: 600; white-space: nowrap\">Show 1 more \u203a\u003c/span>\u003c/div>\u003cdiv style=\"font-size: 12.5px; color: #67676b; line-height: 1.5; margin-top: 4px\">For each lift, warm up, then work up until a set of 6 feels like 2\u20133 reps were left (RPE 7). Log that set. Next week\u2019s targets come from it.\u003cbr>\u003cstrong style='color:#141416'>Effort, in one line\u003c/strong> RPE 10 = nothing left \u00b7 9 = one more rep \u00b7 8 = two more \u00b7 7 = three more.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel\" style=\"padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start\">\u003cspan style=\"width: 28px; height: 28px; border-radius: 999px; border: 1px solid #ececea; display: grid; place-items: center; flex: 0 0 auto; font-size: 13px; color: #67676b\" aria-hidden=\"true\">\u2726\u003c/span>\u003cdiv style=\"flex: 1; min-width: 0\">\u003cdiv style=\"display: flex; justify-content: space-between; gap: 12px\">\u003cstrong style=\"font-size: 13.5px\">Claude changed 31 things today\u003c/strong>\u003ca href=\"#activity\" style=\"font-size: 12px; font-weight: 600; text-decoration: none; color: #141416; white-space: nowrap\">What changed \u203a\u003c/a>\u003c/div>\u003cdiv style=\"font-size: 12.5px; color: #67676b; line-height: 1.5; margin-top: 4px\">Changed Leg workout \u00b7 18:34\u003c/div>\u003c/div>\u003c/div>\n        \u003cdiv style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n          \u003ca class=\"tile g\" href=\"#sessions\">\u003cb>This week\u003c/b>\u003cspan class=\"big\">3\u003c/span>\u003cspan class=\"sub\">of 4 sessions\u003c/span>\u003cspan class=\"chip ok\" style=\"align-self: flex-start; margin-top: 4px\">On plan\u003c/span>\u003cspan class=\"sub\" style=\"margin-top: 6px\">Upper A Thu \u00b7 Lift Fri\u003c/span>\u003c/a>\u003ca class=\"tile o\" href=\"#progress\">\u003cb>Volume\u003c/b>\u003cspan class=\"big\">2.1\u003c/span>\u003cspan class=\"sub\">tonnes this week\u003c/span>\u003cspan class=\"sub\" style=\"margin-top: 6px\">Mon\u2013Sun\u003c/span>\u003c/a>\u003ca class=\"tile \" href=\"#exercises\">\u003cb>Strength\u003c/b>\u003cspan class=\"big\">100\u003c/span>\u003cspan class=\"sub\">kg \u00b7 Back Squat, best set\u003c/span>\u003c/a>\n          \u003ca class=\"tile \" href=\"#progress\">\u003cb>New bests\u003c/b>\u003cspan class=\"big\">0\u003c/span>\u003cspan class=\"sub\">this week\u003c/span>\u003c/a>\u003ca class=\"tile p\" href=\"#progress\">\u003cb>Streak\u003c/b>\u003cspan class=\"big\">1\u003c/span>\u003cspan class=\"sub\">weeks in a row\u003c/span>\u003cspan class=\"sub\" style=\"margin-top: 6px\">Your best\u003c/span>\u003c/a>\u003ca class=\"tile \" href=\"#sessions\">\u003cb>Time trained\u003c/b>\u003cspan class=\"big\">1:00\u003c/span>\u003cspan class=\"sub\">hours this week\u003c/span>\u003cspan class=\"sub\" style=\"margin-top: 6px\">25% of 4 h\u003c/span>\u003c/a>\n        \u003c/div>\n        \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          \u003cdiv class=\"panel\" style=\"flex: 2 1 320px; min-width: 0; padding: 14px 16px\">\n            \u003cp class=\"lbl\">Today\u2019s timeline\u003c/p>\n 1.5px; color: #67676b; line-height: 1.55; max-width: 96ch\">Redrawn from the live dashboard on 18 Nov 2026 after the account held real data (Studio, light). Labels, copy, structure and order were observed. The body figure is a placeholder for the real illustration, tile tints are approximate, and figures and times are sample data.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"TrackAnything":{"title":"Metrics and aches","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900px; align-items: stretch\">\n  \u003caside style=\"flex: 0 0 218px; min-width: 0; border-right: 1px solid #ececea; padding: 24px 14px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; background: #f7f7f5\">\n    \u003cspan style=\"font-size: 17px; font-weight: 700; padding: 0 10px; letter-spacing: -.02em\">Shredpace\u003c/span>\n    \u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#today\">Today\u003c/a>\u003ca href=\"#sessions\">Training\u003c/a>\u003ca href=\"#food\">Food\u003c/a>\u003ca class=\"on\" href=\"#body\">Body\u003c/a>\u003ca href=\"#goals\">Goals\u003c/a>\u003c/nav>\n    \u003cdiv>\u003cp class=\"lbl\" style=\"padding: 0 10px; margin-bottom: 6px\">Tools\u003c/p>\u003cnav class=\"nav\" style=\"display: flex; flex-direction: column; gap: 2px\">\u003ca href=\"#connect\">Ask Claude\u003c/a>\u003ca href=\"#connect\">Your agents\u003c/a>\u003ca href=\"#coach\">Coach\u003c/a>\u003ca href=\"#account\">Settings\u003c/a>\u003c/nav>\u003c/div>\n    \u003ca href=\"#connect\" class=\"panel\" style=\"margin-top: auto; padding: 12px 14px; text-decoration: none; display: block\">\u003cstrong style=\"font-size: 12px; color: #141416; display: block\">Claude is connected\u003c/strong>\u003cspan style=\"font-size: 11.5px; color: #67676b; line-height: 1.5\">Last heard 18:02 \u00b7 logs every set you send\u003c/span>\u003c/a>\n  \u003c/aside>\n  \u003cmain style=\"flex: 999 1 560px; min-width: 0; padding: 18px 34px 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box\">\n\u003cdiv style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px\">\u003cdiv>\u003cp class=\"lbl\">Progress \u203a Body \u203a Weight \u00b7 #metric/\u2026  \u00b7  #ache/\u2026\u003c/p>\u003ch1 style=\"font-size: 28px; margin-top: 6px\">Metric and ache pages\u003c/h1>\u003c/div>\u003cdiv style=\"display: flex; gap: 12px; align-items: center; min-height: 44px\">\u003cspan style=\"font-size: 11.5px; color: #67676b\">Wed, Nov 18, 2026\u003c/span>\u003cspan class=\"av\">S\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n      \u003cdiv class=\"panel\" style=\"flex: 1 1 380px; min-width: 0; padding: 20px\">\n        \u003cspan class=\"seg\" style=\"flex-wrap: wrap\">\u003cbutton type=\"button\" class=\"on\">Weight\u003c/button>\u003cbutton type=\"button\">Body fat\u003c/button>\u003cbutton type=\"button\">Muscle\u003c/button>\u003cbutton type=\"button\">Waist\u003c/button>\u003cbutton type=\"button\">Fat mass\u003c/button>\u003cbutton type=\"button\">Visceral fat\u003c/button>\u003cbutton type=\"button\">BMR\u003c/button>\u003c/span>\n        \u003cp style=\"font-size: 34px; font-weight: 600; margin-top: 14px; letter-spacing: -.02em\">82.3 \u003cspan style=\"font-size: 15px; font-weight: 500\">kg\u003c/span>\u003c/p>\u003cp class=\"mut\" style=\"font-size: 12px\">Wed 18 Nov, 17:42 \u00b7 by hand\u003c/p>\n        \u003cdiv style=\"margin-top: 10px\">\u003cspan class=\"seg\">\u003cbutton type=\"button\">W\u003c/button>\u003cbutton type=\"button\">M\u003c/button>\u003cbutton type=\"button\" class=\"on\">3M\u003c/button>\u003cbutton type=\"button\">Y\u003c/button>\u003cbutton type=\"button\">All\u003c/button>\u003c/span> \u003cspan class=\"mut\" style=\"margin-left: 10px; font-size: 12px\">\u2039 18 Nov \u2013 18 Nov \u203a\u003c/span>\u003c/div>\n        \u003cdiv style=\"position: relative; height: 110px; border-left: 1px solid #ececea; border-bottom: 1px solid #ececea; margin: 10px 0 4px 26px\">\u003cspan style=\"position: absolute; left: -30px; top: -6px; font-size: 10.5px; color: #67676b\">82.4\u003c/span>\u003cspan style=\"position: absolute; left: -30px; top: 44px; font-size: 10.5px; color: #67676b\">82.3\u003c/span>\u003cspan style=\"position: absolute; left: -30px; top: 98px; font-size: 10.5px; color: #67676b\">82.2\u003c/span>\u003cspan style=\"position: absolute; left: 10px; top: 46px; width: 9px; height: 9px; border-radius: 999px; background: #141416\">\u003c/span>\u003c/div>\u003cp class=\"mut\" style=\"font-size: 12px\">A trend needs 3 readings\u003c/p>\n        \u003cp class=\"lbl\" style=\"margin-top: 14px\">Readings \u003ca href=\"#metric\" style=\"font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px\">Add \u203a\u003c/a>\u003c/p>\n        \u003cdiv class=\"row\">\u003cspan>Wed 18 Nov, 17:42\u003csmall>by hand \u00b7 Claude\u003c/small>\u003c/span>\u003cspan>82.3 kg \u203a\u003c/span>\u003c/div>\u003cdiv class=\"row\">\u003cspan>Wed 18 Nov, 17:34\u003csmall>by hand \u00b7 Claude\u003c/small>\u003c/span>\u003cspan>82.3 kg \u203a\u003c/span>\u003c/div>\u003cp class=\"mut\" style=\"font-size: 11.5px\">Tap one to fix or delete it.\u003c/p>\n        \u003cp class=\"lbl\" style=\"margin-top: 12px\">About weight\u003c/p>\u003cp class=\"mut\" style=\"font-size: 12px; margin-top: 4px; line-height: 1.55\">Your weight changes by a kilo or more in a day with water and food. Weigh in the morning, after the toilet and before eating: the 7-day average is the line to watch.\u003c/p>\u003c/div>\n      \u003cdiv style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n        \u003cdiv class=\"panel\" style=\"padding: 20px\">\u003ca href=\"#body\" style=\"font-size: 12.5px; text-decoration: none\">\u2039 Body\u003c/a>\u003ch2 style=\"font-size: 22px; margin-top: 6px\">Resting heart rate\u003c/h2>\u003cp style=\"font-size: 30px; font-weight: 600; margin-top: 6px\">58 \u003cspan style=\"font-size: 14px; font-weight: 500\">bpm\u003c/span>\u003c/p>\n          \u003cdiv style=\"position: relative; height: 60px; border-left: 1px solid #ececea; border-bottom: 1px solid #ececea; margin: 10px 0 4px 26px\">\u003cspan style=\"position: absolute; left: -30px; top: -6px; font-size: 10.5px; color: #67676b\">58.1\u003c/span>\u003cspan style=\"position: absolute; left: -30px; top: 24px; font-size: 10.5px; color: #67676b\">58\u003c/span>\u003cspan style=\"position: absolute; left: -30px; top: 50px; font-size: 10.5px; color: #67676b\">57.9\u003c/span>\u003cspan style=\"position: absolute; left: 10px; top: 24px; width: 9px; height: 9px; border-radius: 999px; background: #141416\">\u003c/span>\u003c/div>\u003cp class=\"mut\" style=\"font-size: 12px\">Lower is better \u00b7 logged daily \u00b7 by Claude\u003c/p>\n          \u003cp class=\"lbl\" style=\"margin-top: 12px\">Goal\u003c/p>\u003cp class=\"mut\" style=\"font-size: 12.5px; margin-top: 4px\">No goal for it yet. \u003ca href=\"#goals\">Set one \u203a\u003c/a>\u003c/p>\n          \u003cp class=\"lbl\" style=\"margin-top: 12px\">Readings\u003c/p>\u003cdiv class=\"row\">\u003cspan>Wed 18 Nov\u003c/span>\u003cspan>58 \u00b7 Claude\u003c/span>\u003c/div>\u003ca href=\"#metric\" style=\"font-size: 12.5px; text-decoration: none\">Edit the metric \u203a\u003c/a>\u003c/div>\n        \u003cdiv class=\"panel\" style=\"padding: 20px\">\u003ca href=\"#body\" style=\"font-size: 12.5px; text-decoration: none\">\u2039 Body\u003c/a>\u003ch2 style=\"font-size: 22px; margin-top: 6px\">Left knee\u003c/h2>\u003cp style=\"font-size: 30px; font-weight: 600; margin-top: 6px\">4/10 \u003cspan class=\"chip\" style=\"margin-left: 8px; vertical-align: 6px\">Steady\u003c/span>\u003c/p>\n          \u003cdiv style=\"position: relative; height: 60px; border-left: 1px solid #ececea; border-bottom: 1px solid #ececea; margin: 10px 0 4px 26px\">\u003cspan style=\"position: absolute; left: -30px; top: -6px; font-size: 10.5px; color: #67676b\">10\u003c/span>\u003cspan style=\"position: absolute; left: -30px; top: 24px; font-size: 10.5px; color: #67676b\">5\u003c/span>\u003cspan style=\"position: absolute; left: -30px; top: 50px; font-size: 10.5px; color: #67676b\">0\u003c/span>\u003cspan style=\"position: absolute; left: 10px; top: 38px; width: 9px; height: 9px; border-radius: 999px; background: #141416\">\u003c/span>\u003c/div>\u003cp class=\"mut\" style=\"font-size: 11.5px\">0 none \u00b7 10 the worst. Logged when you mention it.\u003c/p>\n          \u003cp class=\"lbl\" style=\"margin-top: 12px\">What changes\u003c/p>\u003cp style=\"font-size: 12.5px; margin-top: 4px; line-height: 1.5\">Nothing changes: under 5/10 and not rising, your plan stays as it is.\u003c/p>\n          \u003cp class=\"lbl\" style=\"margin-top: 12px\">The log\u003c/p>\u003cdiv class=\"row\">\u003cspan>4\u003csmall>Wed 18 \u00b7 during squats\u003c/small>\u003c/span>\u003cspan class=\"ch\">Claude\u003c/span>\u003c/div>\n          \u003cp class=\"mut\" style=\"font-size: 11.5px; margin-top: 6px; line-height: 1.5\">At 7/10 or more: \u201cThat\u2019s a lot of pain. Please get it checked before loading it.\u201d Shredpace doesn\u2019t diagnose.\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\u003cp style=\"margin: auto 0 0; font-size: 11.5px; color: #67676b; line-height: 1.55; max-width: 96ch\">Redrawn from the live dashboard on 18 Nov 2026 after the account held real data (Studio, light). Labels, copy, structure and order were observed. The body figure is a placeholder for the real illustration, tile tints are approximate, and figures and times are sample data. Body metrics open at #metric/weight, a custom metric at #metric/{id}, an ache at #ache/{area}/{side}.\u003c/p>\n  \u003c/main>\n\u003c/div>"},"Upgrade":{"title":"Plan","w":1280,"h":900,"html":"\u003cdiv style=\"display: flex; flex-wrap: wrap; min-height: 900p r; min-height: 44px\">\u003cspan style=\"font-size: 11.5px; color: #67676b\">Wed, Nov 18, 2026\u003c/span>\u003cspan class=\"av\">S\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv class=\"panel\" style=\"padding: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 640px\">\u003cp class=\"lbl\">Plan\u003c/p>\n      \u003cdiv style=\"display: flex; gap: 10px; align-items: center\">\u003ch2 style=\"font-size: 26px\">Pro\u003c/h2>\u003cspan class=\"chip\" style=\"background: #141416; color: #fff\">Early Pro\u003c/span>\u003c/div>\n      \u003cp style=\"font-size: 13.5px; line-height: 1.6\">Free while Shredpace is in early access. Everything in Pro is on: your whole history, several agents, the coach\u2019s take, programs, every theme and export.\u003c/p>\n      \u003cp class=\"mut\" style=\"font-size: 12.5px; line-height: 1.6\">When pricing is ready you\u2019ll see the date here at least 14 days ahead. Nothing you log is ever deleted.\u003c/p>\u003c/div>\n    \u003cdiv class=\"panel\" style=\"padding: 22px; max-width: 640px; display: flex; flex-direction: column; gap: 8px\">\u003ch2 style=\"font-size: 17px\">Help shape Shredpace\u003c/h2>\u003cp class=\"mut\" style=\"font-size: 13px\">You\u2019re one of the first. What works, what doesn\u2019t, what\u2019s missing?\u003c/p>\u003cdiv>\u003cbutton type=\"button\" style=\"min-height: 44px; padding: 0 22px; border-radius: 999px; border: 0; background: #141416; color: #fff; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer\">Send feedback\u003c/button>\u003c/div>\u003cp class=\"mut\" style=\"font-size: 12px\">Or tell your agent: it sends it for you.\u003c/p>\u003c/div>\n\u003cp style=\"margin: auto 0 0; font-size: 11.5px; color: #67676b; line-height: 1.55; max-width: 96ch\">Redrawn from the live dashboard on 18 Nov 2026 (Studio, light). Layout, labels and copy were observed; the body figure is a placeholder for the real anatomical illustration, tile tints are approximate, and the figures are sample data. On the live site #upgrade redirects here.\u003c/p>\n  \u003c/main>\n\u003c/div>"}}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var SCREENS = DATA.screens, BOARDS = DATA.boards;
  var byHash = {}, byId = {};
  SCREENS.forEach(function (s) { byHash[s.hash] = s; byId[s.id] = s; });

  var state = { phone: window.innerWidth < 760, pro: false, auth: true };
  try {
    var saved = JSON.parse(localStorage.getItem('sp.state') || 'null');
    if (saved) { state.pro = !!saved.pro; state.auth = !!saved.auth;
                 if (typeof saved.phone === 'boolean') state.phone = saved.phone; }
  } catch (e) {}
  function save() { try { localStorage.setItem('sp.state', JSON.stringify(state)); } catch (e) {} }

  // The shipped router, as read from the bundle's four registries.
  function resolve(s) {
    var note = '';
    if (!state.auth && !s.public) return { board: 'SignIn', note: 'Signed out: every private screen falls back to the SignIn board.' };
    if (state.auth && (s.id === 'landing' || s.id === 'signin' || s.id === 'connector'))
      note = 'The real router sends a signed-in visitor from here to #today.';
    var board;
    if (s.pro) {
      if (state.pro || s.limited) {
        board = state.phone ? s.pro[1] : s.pro[0];
        if (!state.pro && s.limited) note = 'Reachable on Free, but degraded: charts stop at 90 days.';
      } else { board = s.locked; note = 'Free plan: Coach and Programs are hard-locked to FreeCoachLocked.'; }
    } else {
      board = (state.phone && s.phone) ? s.phone : s.desk;
      if (state.phone && !s.phone && s.desk) note = 'No phone board: the desktop board is drawn at every width.';
    }
    if (!board) board = s.desk || s.phone;
    return { board: board, note: note };
  }

  var fit = document.getElementById('fit'), bd = document.getElementById('bd');
  var current = null;

  function layout() {
    if (!current) return;
    var b = BOARDS[current.board];
    var avail = fit.parentNode.clientWidth;
    bd.style.transform = 'none';
    bd.style.width = b.w + 'px';
    var natural = b.w === 390 ? b.h : Math.max(bd.scrollHeight, 400);
    var scale = Math.min(1, avail / b.w);
    bd.style.transform = 'scale(' + scale + ')';
    fit.style.width = Math.round(b.w * scale) + 'px';
    fit.style.height = Math.round(natural * scale) + 'px';
    document.getElementById('cZoom').textContent =
      Math.round(scale * 100) + '%  ·  ' + b.w + '×' + Math.round(natural);
  }

  function show(s) {
    var r = resolve(s), b = BOARDS[r.board];
    current = { screen: s, board: r.board };
    bd.dataset.board = r.board;
    bd.innerHTML = b.html;
    fit.className = 'fit ' + (b.w === 390 ? 'phone' : 'desk');

    document.getElementById('rRoute').textContent = s.route;
    document.getElementById('rBoard').textContent = r.board;
    document.getElementById('rScreen').textContent = 'screen: ' + s.id;
    document.getElementById('rFrame').textContent = b.w === 390 ? 'phone 390×844' : 'desktop 1280';
    document.getElementById('cBoard').textContent = r.board;
    document.getElementById('cRoute').textContent = b.title;
    var nb = document.getElementById('noteBar');
    nb.hidden = !r.note;
    document.getElementById('noteText').textContent = r.note || '';

    document.querySelectorAll('.row').forEach(function (el) {
      el.setAttribute('aria-current', el.dataset.go === s.hash ? 'true' : 'false');
    });
    layout();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function go() {
    var h = (location.hash || '#today').slice(1);
    var s = byHash[h] || byId.today;
    show(s);
  }

  // toggles
  document.querySelectorAll('[data-set]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state[btn.dataset.set] = btn.dataset.val === '1';
      save(); paint(); go();
    });
  });
  function paint() {
    document.querySelectorAll('[data-set]').forEach(function (btn) {
      var on = state[btn.dataset.set] === (btn.dataset.val === '1');
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    buildSheet();
  }

  // in-board anchors scroll inside the board instead of reaching the router
  bd.addEventListener('click', function (e) {
    var a = e.target.closest('[data-scroll]');
    if (!a) return;
    e.preventDefault();
    var t = bd.querySelector('#' + CSS.escape(a.dataset.scroll));
    if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // screen directory
  var sheet = document.getElementById('sheet'), sheetBody = document.getElementById('sheetBody');
  function buildSheet() {
    var groups = [], seen = {};
    SCREENS.forEach(function (s) {
      if (!seen[s.group]) { seen[s.group] = []; groups.push(s.group); }
      seen[s.group].push(s);
    });
    sheetBody.innerHTML = groups.map(function (g) {
      return '<div class="grp"><h3>' + g + '</h3><div class="rows">' + seen[g].map(function (s) {
        var r = resolve(s);
        var tag = s.pro ? '<span class="tag ' + (r.board === s.locked ? 'lock' : 'pro') + '">' +
                          (r.board === s.locked ? 'Locked' : 'Pro') + '</span>'
                        : (s.public ? '<span class="tag pub">Public</span>' : '');
        return '<button type="button" class="row" data-go="' + s.hash + '">' +
               '<span class="rt">' + s.route + '</span>' + tag +
               '<span class="bn">' + r.board + '</span></button>';
      }).join('') + '</div></div>';
    }).join('');
    document.getElementById('sheetCount').textContent = SCREENS.length + ' screens · ' + Object.keys(BOARDS).length + ' boards';
    document.getElementById('openCount').textContent = SCREENS.length;
    sheetBody.querySelectorAll('.row').forEach(function (el) {
      el.addEventListener('click', function () { location.hash = '#' + el.dataset.go; closeSheet(); });
      if (current && el.dataset.go === current.screen.hash) el.setAttribute('aria-current', 'true');
    });
  }
  function openSheet() { sheet.hidden = false; document.getElementById('closeIndex').focus(); }
  function closeSheet() { sheet.hidden = true; document.getElementById('openIndex').focus(); }
  document.getElementById('openIndex').addEventListener('click', openSheet);
  document.getElementById('closeIndex').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(layout, 90); });
  window.addEventListener('hashchange', go);
  document.fonts && document.fonts.ready.then(layout);
  paint(); go();
})();
</script>
